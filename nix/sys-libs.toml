# after an edit, `motley update rehash` rewrites any act.lock whose sys this changed
[cargo]
libz-ng-sys = "zlib"
# both crates bundle their own xz whenever LZMA_API_STATIC is set at all, even to 0
lzma-sys                = "xz"
liblzma-sys             = "xz"
libnghttp2-sys          = "nghttp2"
lz4-sys                 = "lz4"
yeslogic-fontconfig-sys = "fontconfig"
expat-sys               = "expat"
libxml                  = "libxml2"
alsa-sys                = "alsa-lib"
glib-sys                = "glib"
gobject-sys             = "glib"
gio-sys                 = "glib"
libarchive3-sys         = "libarchive"
brotli-sys              = "brotli"
libseccomp-sys          = "libseccomp"
llvm-sys                = "llvm"

[cargo.openssl-sys]
pkg                     = "openssl"
env.OPENSSL_NO_VENDOR   = "1"
env.OPENSSL_DIR         = "{root}"
env.OPENSSL_LIB_DIR     = "{root}/lib"
env.OPENSSL_INCLUDE_DIR = "{root}/include"

[cargo.libz-sys]
pkg                 = "zlib"
env.LIBZ_SYS_STATIC = "0"
env.ZLIB_NO_VENDOR  = "1"

[cargo.zstd-sys]
pkg                         = "zstd"
env.ZSTD_SYS_USE_PKG_CONFIG = "1"

[cargo.bzip2-sys]
pkg                          = "bzip2"
env.BZIP2_SYS_USE_PKG_CONFIG = "1"

[cargo.libsqlite3-sys]
pkg                               = "sqlite"
env.LIBSQLITE3_SYS_USE_PKG_CONFIG = "1"

[cargo.curl-sys]
pkg                   = "curl"
env.LIBCURL_NO_VENDOR = "1"

[cargo.libgit2-sys]
pkg                   = "libgit2"
env.LIBGIT2_NO_VENDOR = "1"

[cargo.libssh2-sys]
pkg                            = "libssh2"
env.LIBSSH2_SYS_USE_PKG_CONFIG = "1"

[cargo.pcre2-sys]
pkg                  = "pcre2"
env.PCRE2_SYS_STATIC = "0"

[cargo.onig_sys]
pkg                          = "oniguruma"
env.RUSTONIG_SYSTEM_LIBONIG  = "1"
env.RUSTONIG_DYNAMIC_LIBONIG = "1"

[cargo.libsodium-sys]
pkg                       = "libsodium"
env.SODIUM_USE_PKG_CONFIG = "1"

[cargo.freetype-sys]
pkg                             = "freetype"
env.FREETYPE_SYS_USE_PKG_CONFIG = "1"

[cargo.libffi-sys]
pkg                           = "libffi"
env.LIBFFI_SYS_USE_PKG_CONFIG = "1"

[cargo.libdbus-sys]
pkg                         = "dbus"
env.DBUS_SYS_USE_PKG_CONFIG = "1"

[cargo.tikv-jemalloc-sys]
pkg                   = "jemalloc"
env.JEMALLOC_OVERRIDE = "{root}/lib/libjemalloc.so"

[cargo.clang-sys]
pkg               = "clang"
env.LIBCLANG_PATH = "{root}/lib"

[cargo.gmp-mpfr-sys]
pkg                               = "gmp"
env.CARGO_FEATURE_USE_SYSTEM_LIBS = "1"

[go]
"github.com/deluan/go-taglib"          = "taglib"
"go.senan.xyz/taglib"                  = "taglib"
"github.com/google/gopacket"           = "libpcap"
"github.com/davidbyttow/govips/v2"     = "vips"
"gopkg.in/gographics/imagick.v3"       = "imagemagick"
"github.com/linxGnu/grocksdb"          = "rocksdb"
"github.com/containers/gpgme"          = "gpgme"
"github.com/seccomp/libseccomp-golang" = "libseccomp"
"github.com/coreos/go-systemd/v22"     = "systemd"

[go."github.com/mattn/go-sqlite3"]
pkg  = "sqlite"
tags = [ "libsqlite3" ]

[python]
psycopg2    = "libpq"
psycopg-c   = "libpq"
lxml        = "libxml2"
mysqlclient = "mariadb-connector-c"
pycairo     = "cairo"
pygobject   = "glib"
dbus-python = "dbus"
python-ldap = "openldap"
cffi        = "libffi"
pysqlite3   = "sqlite"
brotli      = "brotli"

[python.pyyaml]
pkg                      = "libyaml"
env.PYYAML_FORCE_LIBYAML = "1"

[python.pyzmq]
pkg                 = "zeromq"
env.PYZMQ_NO_BUNDLE = "1"

[python.pycurl]
pkg                    = "curl"
env.PYCURL_SSL_LIBRARY = "openssl"

[python.h5py]
pkg          = "hdf5"
env.HDF5_DIR = "{root}"

[python.cryptography]
pkg             = "openssl"
tools           = [ "maturin", "rust" ]
env.OPENSSL_DIR = "{root}"

[python.pynacl]
pkg                = "libsodium"
env.SODIUM_INSTALL = "system"

[python.bcrypt]
tools = [ "maturin", "rust" ]

[python.rpds-py]
tools = [ "maturin", "rust" ]

[python.pydantic-core]
tools = [ "maturin", "rust" ]

[python.orjson]
tools = [ "maturin", "rust" ]

[python.zstandard]
pkg                           = "zstd"
configSettings.--build-option = "--system-zstd"

[python.pycares]
pkg                        = "c-ares"
env.PYCARES_USE_SYSTEM_LIB = "1"

[python.uvloop]
pkg                           = "libuv"
configSettings.--build-option = "--use-system-libuv"

[python.pygit2]
pkg         = "libgit2"
env.LIBGIT2 = "{root}"

[gems]

[gems.psych]
pkg   = "libyaml"
flags = [ "--with-libyaml-dir={root}" ]

[gems.nokogiri]
pkg                               = "libxml2"
flags                             = [ "--use-system-libraries" ]
env.NOKOGIRI_USE_SYSTEM_LIBRARIES = "1"

[gems.sqlite3]
pkg   = "sqlite"
flags = [ "--enable-system-libraries", "--with-sqlite3-dir={root}" ]

[gems.pg]
pkg   = "libpq"
flags = [ "--with-pg-dir={root}" ]

[gems.mysql2]
pkg   = "mariadb-connector-c"
flags = [ "--with-mysql-dir={root}" ]

[gems.ffi]
pkg   = "libffi"
flags = [ "--enable-system-libffi" ]

[gems.openssl]
pkg   = "openssl"
flags = [ "--with-openssl-dir={root}" ]

[gems.zlib]
pkg   = "zlib"
flags = [ "--with-zlib-dir={root}" ]

[gems.rugged]
pkg   = "libgit2"
flags = [ "--use-system-libraries" ]

[gems.re2]
pkg   = "re2"
flags = [ "--enable-system-libraries" ]

[gems.hiredis]
pkg   = "hiredis"
flags = [ "--with-system-hiredis" ]

[gems.rmagick]
pkg = "imagemagick"

[gems.ruby-vips]
pkg = "vips"

[gems.curses]
pkg = "ncurses"

[gems.idn-ruby]
pkg   = "libidn"
flags = [ "--with-idn-dir={root}" ]

[gems.charlock_holmes]
pkg   = "icu"
flags = [ "--with-icu-dir={root}" ]

[gems.gpgme]
pkg                                 = "gpgme"
flags                               = [ "--use-system-libraries" ]
env.RUBY_GPGME_USE_SYSTEM_LIBRARIES = "1"

