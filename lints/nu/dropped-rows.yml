id: dropped-rows
language: nu
severity: error
message: "a false `if` with no `else` yields null and `each` loses the row, so add an else, filter first with `where`, or end in `| compact`"
rule:
  kind: pipe_element
  has:
    kind: command
    regex: '^(each|par-each)\b'
    has:
      kind: val_closure
      has:
        kind: pipeline
        nthChild: {position: 1, reverse: true, ofRule: {kind: pipeline}}
        has:
          kind: pipe_element
          nthChild: {position: 1, reverse: true, ofRule: {kind: pipe_element}}
          has:
            kind: ctrl_if
            not: {regex: '\belse\b'}
  not:
    precedes:
      kind: pipe_element
      regex: '^(compact|ignore|flatten)\b'
      stopBy:
        kind: pipe_element
        not: {regex: '^(compact|ignore|flatten)\b'}
