id: literal-star
language: nu
severity: error
message: "ls, rm, cp, mv and du take a quoted string as one literal name, * included, so pass a bare word or `| into glob`"
rule:
  any:
    - kind: val_string
    - kind: val_interpolated
  regex: '\*'
  inside:
    kind: command
    regex: '^(ls|rm|cp|mv|du)\s'
    stopBy: {kind: expr_parenthesized}
