name: target-test
# Cross-built outputs run on real hardware. tools/target-test packs their closure (nix-store -qR
# into tar -C /) as a release asset, starts this with one command per line and follows the run.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: the machine, a runs-on label
        required: true
        type: choice
        options: [windows-latest, windows-11-arm, macos-latest, macos-13, ubuntu-24.04-arm]
      url:
        description: the closure tarball
        required: true
      commands:
        description: one per line, naming store paths as they were packed
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    steps:
      - name: unpack the closure
        shell: bash
        run: |
          curl -fsSL -o closure.tar.gz "${{ inputs.url }}"
          if [ "$RUNNER_OS" = Windows ]; then
            # Windows has no /nix, so the store lands under C: and the commands are rewritten to match
            mkdir -p /c/nix
            tar -C /c -xzf closure.tar.gz
            echo "STORE_PREFIX=/c" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" = macOS ]; then
            curl -fsSL https://install.determinate.systems/nix | sh -s -- install --no-confirm >/dev/null
            sudo tar -C / -xzf closure.tar.gz
            echo "STORE_PREFIX=" >> "$GITHUB_ENV"
          else
            sudo mkdir -p /nix
            sudo chown "$USER" /nix
            tar -C / -xzf closure.tar.gz
            echo "STORE_PREFIX=" >> "$GITHUB_ENV"
          fi
      - name: run the commands
        shell: bash
        run: |
          failed=0
          while IFS= read -r command; do
            if [ -z "$command" ]; then continue; fi
            echo "::group::$command"
            if ! (cd "$STORE_PREFIX/" && eval "${command//\/nix\/store/$STORE_PREFIX/nix/store}"); then
              echo "::error::$command failed"
              failed=1
            fi
            echo "::endgroup::"
          done <<'EOF'
          ${{ inputs.commands }}
          EOF
          exit $failed
