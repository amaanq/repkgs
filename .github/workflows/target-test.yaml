# Driven by tools/target-test, which reads the log back as `<job> <step> <time> <line>`, so the job
# stays `run` and step names stay one word
name: target-test

on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub runner label
        type: choice
        required: true
        options:
          - ubuntu-24.04-arm
          - macos-latest
          - macos-13
          - windows-latest
          - windows-11-arm
      url:
        description: closure tarball, store paths relative to /
        required: true
      commands:
        description: newline separated shell checks naming /nix/store paths
        required: true

jobs:
  run:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        shell: bash
    env:
      CLOSURE_URL: ${{ inputs.url }}
      CHECKS: ${{ inputs.commands }}
    steps:
      - name: store
        run: |
          case "$RUNNER_OS" in
            Linux)
              sudo install -d -o "$USER" /nix
              echo "STORE_ROOT=" >> "$GITHUB_ENV"
              ;;
            macOS)
              # the sealed system volume refuses mkdir /nix, the installer adds a synthetic.conf entry and an APFS volume
              curl -fsSL https://nixos.org/nix/install | sh -s -- --daemon --yes
              echo "STORE_ROOT=" >> "$GITHUB_ENV"
              ;;
            Windows)
              mkdir -p /c/nix
              echo "STORE_ROOT=/c" >> "$GITHUB_ENV"
              ;;
          esac

      - name: fetch
        run: |
          as_root=""
          if [ "$RUNNER_OS" = macOS ]; then as_root=sudo; fi
          curl -fsSL --retry 3 "$CLOSURE_URL" | $as_root tar -xzf - -C "${STORE_ROOT:-/}"

      - name: check
        run: |
          failed=0
          while IFS= read -r line; do
            line="${line%$'\r'}"
            case "$line" in "" | "#"*) continue ;; esac

            check="${line//\/nix\/store\//$STORE_ROOT/nix/store/}"
            echo "::group::$check"
            if ! bash -c "$check"; then
              echo "::error::failed: $check"
              failed=1
            fi
            echo "::endgroup::"
          done <<< "$CHECKS"
          exit "$failed"
