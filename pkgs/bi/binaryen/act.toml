tag   = "version_{version}"
track = "github:WebAssembly/binaryen"
with  = [ "cmake" ]
tools = [ "cpython" ]

[fetch.default]
archive = true

[fetch.googletest]
url = "https://github.com/google/googletest/releases/download/v{googletest}/googletest-{googletest}.tar.gz"

[steps.before]
"cmake.configure" = [ "binaryen.googletest" ]

[env]
BINARYEN_GTEST = "{source:googletest}"
