track = 'generic:xorg-server?url=https://xorg.freedesktop.org/archive/individual/xserver/&regex=xorg-server-([0-9.]+)\.tar\.xz'
fetch = { url = "https://xorg.freedesktop.org/archive/individual/xserver/xorg-server-{version}.tar.xz" }
with = [ "meson" ]
deps = [
  "libxau",
  "libxdmcp",
  "libxfont2",
  "libxkbfile",
  "openssl",
  "pixman",
  "xorgproto",
  "xtrans",
]

[only]
os = [ "linux" ]

[test]
bin = [ "Xvfb" ]
# only the Xorg server has a version flag
version = false

[meson.defs]
default_font_path = "built-ins"
dri1              = "false"
dri2              = "false"
dri3              = "false"
glamor            = "false"
glx               = false
hal               = "false"
log_dir           = "/var/log"
secure-rpc        = false
sha1              = "libcrypto"
systemd_logind    = "false"
udev              = false
udev_kms          = false
xkb_output_dir    = "/tmp"
xnest             = "false"
xorg              = "false"
xquartz           = "false"
xwin              = "false"
xkb_bin_dir       = "{pkg:xkbcomp}/bin"
xkb_dir           = "{pkg:xkeyboard-config}/share/X11/xkb"
