track   = "generic:file?url=https://astron.com/pub/file/"
fetch   = { url = "https://astron.com/pub/file/file-{version}.tar.gz" }
with    = [ "autotools" ]
deps    = [ "zlib", "bzip2", "xz", "zstd" ]
patches = [ "relocatable.patch", "upstream-mingw-timespec.patch" ]

[on.cross]
tools = [ "file" ]

[on.cross.autotools]
makeFlags = [ "FILE_COMPILE=file" ]

[on.windows]
deps = [ "tre" ]
