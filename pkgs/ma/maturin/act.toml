tag   = "v{version}"
track = "github:PyO3/maturin"
fetch = { archive = true }
with  = [ "cargo" ]

[steps]
skip = [ "cargo.test" ]

[cargo]
noDefaultFeatures = true

[builds.python]
names = [ "bcrypt", "cryptography", "orjson", "pydantic-core", "rpds-py" ]
tools = [ "rust" ]

[install]
"lib/python3/site-packages/" = "{source:default}/maturin"
