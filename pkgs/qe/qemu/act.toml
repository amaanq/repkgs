fetch = { url = "https://download.qemu.org/qemu-{version}.tar.xz" }
deps  = [ "glib", "zlib" ]
tools = [ "cpython", "ninja" ]

[track]
from = "generic:qemu"

[track.watch]
url   = "https://download.qemu.org/"
regex = 'qemu-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.xz'

[test]
bin = [ "qemu-aarch64", "qemu-loongarch64", "qemu-ppc64le", "qemu-riscv64", "qemu-x86_64" ]

[steps]
phases = [ "qemu.configure", "qemu.build", "qemu.test", "qemu.install" ]
