[upstream]
purl = "pkg:generic/qemu"

[[source]]
key  = "default"
url  = "https://download.qemu.org/qemu-{version}.tar.xz"
hash = "sha256-RXktB55ePzWtD7PCnioQ/QNe02AxLb1clXBjrO4jhxE="

[pin]
version = "11.1.1"

[watch]
url   = "https://download.qemu.org/"
regex = 'qemu-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.xz'

[build]
bin    = [ "qemu-aarch64", "qemu-loongarch64", "qemu-ppc64le", "qemu-riscv64", "qemu-x86_64" ]
check  = false
needs  = [ "glib", "zlib" ]
phases = [ "qemu.configure", "qemu.build", "qemu.install" ]
tools  = [ "cpython", "ninja" ]
