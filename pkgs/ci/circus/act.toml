fetch = { url = "https://github.com/manic-systems/circus/archive/{rev}.tar.gz" }
with  = [ "cargo" ]
deps  = [ "nix" ]
tools = [ "capnproto" ]

[track]
from = "github:manic-systems/circus?branch=main"
base = "0.14.0"

[tests]
dependencies = [ "cacert", "git", "nix" ]

[cargo.cratePatches]
evix             = [ "{file:evix/read-only-schema.patch}" ]
nix-bindings-sys = [ "{file:../../ev/evix/nix-bindings-sys-fromattrs.patch}" ]

[steps.after]
"cargo.install" = [ "circus.bundle-assets" ]
