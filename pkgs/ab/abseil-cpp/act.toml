track   = "github:abseil/abseil-cpp"
fetch   = { asset = "abseil-cpp-{tag}.tar.gz" }
with    = [ "cmake" ]
deps    = [ "googletest" ]
patches = [ "github:abseil/abseil-cpp/commit/ddbdebc6c8fd305597fe03a0fc00411cf09801b0" ]

[cmake.defs]
ABSL_BUILD_TESTING           = true
ABSL_PROPAGATE_CXX_STD       = true
ABSL_USE_EXTERNAL_GOOGLETEST = true
CMAKE_CXX_STANDARD           = "17"

[env]
TZDIR = "{source:default}/absl/time/internal/cctz/testdata/zoneinfo"
