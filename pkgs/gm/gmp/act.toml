track   = "gnu:gmp"
fetch   = { url = "https://ftpmirror.gnu.org/gmp/gmp-{version}.tar.xz" }
with    = [ "autotools" ]
tools   = [ "m4" ]
patches = [ "upstream-loongarch-int128.patch" ]

[autotools]
flags = [ "--enable-cxx", "--with-pic" ]

[bindings]
hackage = [ "bitset", "gmpint", "idris" ]

[bindings.cargo]
names = [ "gmp-mpfr-sys" ]
env   = { CARGO_FEATURE_USE_SYSTEM_LIBS = "1" }
