[upstream]
purl = "pkg:gnu/gmp"

[[source]]
key  = "default"
url  = "https://ftpmirror.gnu.org/gmp/gmp-{version}.tar.xz"
hash = "sha256-nF3xoBP+lLYF8J3Ph791wff0SjhpeRSCB82qLolvg80="

[pin]
version = "6.3.0"
date    = "2023-07-30"

[build]
patches = [ "upstream-loongarch-int128.patch" ]
systems = [ "autotools" ]
tools   = [ "m4" ]

[build.autotools]
flags = [ "--enable-cxx", "--with-pic" ]
