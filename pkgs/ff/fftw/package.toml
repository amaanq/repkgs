[upstream]
purl = "pkg:generic/fftw?url=https://fftw.org/download.html"

[[source]]
key  = "default"
url  = "https://fftw.org/fftw-{version}.tar.gz"
hash = "sha256-qMPerljMUwV071hie1PG4OHtXN4UvZG+O9wgYwFDpuY="

[pin]
version = "3.3.11"

[package]
uses              = [ "autotools" ]
buildDependencies = [ "perl" ]

[package.autotools]
flags = [ "--enable-threads", "CFLAGS=-O3 -fomit-frame-pointer -fstrict-aliasing" ]

[when.os.windows.autotools]
flags     = [ "--with-combined-threads" ]
makeFlags = [ "LDFLAGS=-no-undefined" ]
