track = "generic:fftw?url=https://fftw.org/download.html"
fetch = { url = "https://fftw.org/fftw-{version}.tar.gz" }
with  = [ "autotools" ]
tools = [ "perl" ]

[autotools]
flags = [ "--enable-threads", "CFLAGS=-O3 -fomit-frame-pointer -fstrict-aliasing" ]

[on.windows.autotools]
flags     = [ "--with-combined-threads" ]
makeFlags = [ "LDFLAGS=-no-undefined" ]
