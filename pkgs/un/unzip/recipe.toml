[upstream]
frozen = "Info-ZIP, last release 2009"

[[source]]
key  = "default"
url  = "https://downloads.sourceforge.net/infozip/unzip60.tar.gz"
hash = "sha256-qLgZcx1BdkPe8Y/hb6nqaVSvtt3KWbxkTNKVHyQAPGw="

[pin]
version = "6.0"

[build]
phases = [ "unzip.build" ]

[build.check]
version = "-v"

[build.install]
"bin/" = [ "unzip", "funzip", "unzipsfx" ]

[build.links]
"bin/zipinfo" = "unzip"

[build.targets]
posix = true
