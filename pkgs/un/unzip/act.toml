fetch = { url = "https://downloads.sourceforge.net/infozip/unzip60.tar.gz" }
deps = [ "bzip2" ]
patches = [
  "01-CVE-2014-8139.diff",
  "02-CVE-2014-8140.diff",
  "03-CVE-2014-8141.diff",
  "04-CVE-2014-9636.diff",
  "05-CVE-2014-9636-rebased.diff",
  "06-CVE-2015-7696.diff",
  "07-CVE-2015-7697.diff",
  "08-CVE-2014-9913.patch",
  "09-CVE-2016-9844.patch",
  "10-CVE-2018-18384.patch",
  "https://github.com/madler/unzip/commit/41beb477c5744bc396fa1162ee0c14218ec12213.patch",
  "12-CVE-2019-13232-2.patch",
  "13-CVE-2019-13232-2-rebased.patch",
  "https://github.com/madler/unzip/commit/6d351831be705cc26d897db44f878a978f4138fc.patch",
  "15-initialize-the-symlink-flag.patch",
  "16-CVE-2022-0529-and-CVE-2022-0530.patch",
  "17-CVE-2021-4217.patch",
]

[track]
frozen = "Info-ZIP, last release 2009"

[test]
version = "-v"

[steps]
phases = [ "unzip.build" ]

[only]
posix = true

[install]
"bin/" = [ "unzip", "funzip", "unzipsfx" ]

[links]
"bin/zipinfo" = "unzip"
