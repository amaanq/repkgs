tag   = "curl-{version_}"
track = "github:curl/curl"
fetch = { url = "https://curl.se/download/curl-{version}.tar.xz" }
with  = [ "cmake" ]
deps  = [ "openssl", "zlib", "zstd", "nghttp2", "brotli", "libssh2" ]
tools = [ "perl" ]
test  = false

[steps.after]
"cmake.install" = [ "curl.plain-cc" ]

[cmake]
tool = "cmake-bootstrap"

[cmake.defs]
BUILD_LIBCURL_DOCS  = false
BUILD_MISC_DOCS     = false
CURL_CA_BUNDLE      = "/etc/ssl/certs/ca-certificates.crt"
CURL_CA_PATH        = "/etc/ssl/certs"
CURL_CA_SEARCH_SAFE = true
CURL_USE_LIBPSL     = false
CURL_BROTLI         = true
CURL_USE_LIBSSH2    = true
CURL_USE_OPENSSL    = true
ENABLE_CURL_MANUAL  = false
USE_NGHTTP2         = true

[bindings]
hackage = [ "curl", "darcs-beta", "minicurl" ]

[bindings.cargo]
names = [ "curl-sys" ]
env   = { LIBCURL_NO_VENDOR = "1" }

[bindings.python]
names = [ "pycurl" ]
env   = { PYCURL_SSL_LIBRARY = "openssl" }
