[upstream]
purl = "pkg:github/curl/curl"

[[source]]
key  = "default"
url  = "https://curl.se/download/curl-{version}.tar.xz"
hash = "sha256-3GBq7T5iU08VargRfd86qmAnheWRRd7ijH55PCw+ghY="

[pin]
version = "8.22.0"
tag     = "curl-8_22_0"
date    = "2026-09-02"

[build]
check   = false
needs   = [ "openssl", "zlib", "zstd" ]
systems = [ "cmake" ]
tools   = [ "perl" ]

[build.after]
"cmake.install" = [ "curl.plain-cc" ]

[build.cmake.defs]
BUILD_LIBCURL_DOCS  = false
BUILD_MISC_DOCS     = false
CURL_CA_BUNDLE      = "/etc/ssl/certs/ca-certificates.crt"
CURL_CA_PATH        = "/etc/ssl/certs"
CURL_CA_SEARCH_SAFE = true
CURL_USE_LIBPSL     = false
CURL_USE_LIBSSH2    = false
CURL_USE_OPENSSL    = true
ENABLE_CURL_MANUAL  = false
