[upstream]
purl = "pkg:github/protocolbuffers/protobuf"

[[source]]
key  = "default"
url  = "https://github.com/protocolbuffers/protobuf/releases/download/{tag}/protobuf-{version}.tar.gz"
hash = "sha256-SB17YwMdkCp4jPcX5Csf13IUGVNLaqwH5YJXugAeqMY="

[pin]
version = "36.1"
date    = "2026-08-31"
tag     = "v36.1"

[package]
uses         = [ "cmake" ]
dependencies = [ "googletest", "abseil-cpp", "zlib" ]

[package.cmake.defs]
protobuf_ABSL_PROVIDER      = "package"
protobuf_BUILD_SHARED_LIBS  = true
protobuf_USE_EXTERNAL_GTEST = true
