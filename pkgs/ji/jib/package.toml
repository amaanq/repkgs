[package]
version = "1.0.0"
source  = { exclude = [ "target" ], files = [ ".rs", "Cargo.toml", "Cargo.lock", "README.md" ], name = "jig-src", tree = "../jig/src" }
uses    = [ "cargo" ]
bin     = [ "jib" ]

[package.platforms]
posix = true

[package.cargo]
flags = [ "-p", "jib" ]
tool  = "{tool:rust-bootstrap}"

[package.tests]
version = false

[package.env]
JIG_STORE_DIR = "/nix/store"
