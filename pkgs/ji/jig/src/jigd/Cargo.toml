[package]
name         = "jigd"
description  = "Compilation cache and compiler slot daemon for repkgs"
license      = "EUPL-1.2"
repository   = "https://github.com/amaanq/repkgs"
keywords     = [ "cache", "compiler", "nix", "bootstrap" ]
categories   = [ "command-line-utilities", "development-tools" ]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true

[dependencies]
blake3      = { workspace = true }
color-eyre  = { workspace = true }
eyre        = { workspace = true }
rustix      = { workspace = true }
signal-hook = { default-features = false, version = "0.3" }
wire        = { workspace = true }

[lints]
workspace = true
