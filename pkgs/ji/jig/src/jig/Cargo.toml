[package]
name                   = "jig"
description            = "Compiler wrapper and cache client for repkgs"
license                = "EUPL-1.2"
repository             = "https://github.com/amaanq/repkgs"
keywords               = [ "cache", "compiler", "nix", "bootstrap" ]
categories             = [ "command-line-utilities", "development-tools" ]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true

[dependencies]
base64     = "0.23"
blake3     = { workspace = true }
color-eyre = { workspace = true }
eyre       = { workspace = true }
pound      = "0.1.7"
serde      = { features = [ "derive" ], version = "1" }
serde_json = { features = [ "preserve_order" ], version = "1" }
sha2       = "0.11"
tempfile   = "3"
toml       = "1"
ureq       = { default-features = false, features = [ "rustls" ], version = "3" }
wire       = { workspace = true }
zstd       = { workspace = true }

[lints]
workspace = true
