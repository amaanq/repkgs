[package]
name                   = "jib"
description            = "Build script executor for repkgs"
license                = "EUPL-1.2"
repository             = "https://github.com/amaanq/repkgs"
keywords               = [ "build", "nix", "bootstrap" ]
categories             = [ "command-line-utilities", "development-tools" ]
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true

[dependencies]
blake3     = { workspace = true }
color-eyre = { workspace = true }
eyre       = { workspace = true }
jig        = { workspace = true }
pound      = "0.1.7"
serde      = { features = [ "derive" ], version = "1" }
serde_json = "1"
wire       = { workspace = true }

[lints]
workspace = true
