[package]
name         = "jigd"
description  = "Compilation cache and compiler slot daemon for repkgs"
version      = "3.0.0"
edition      = "2024"
rust-version = "1.97.1"

[[bin]]
name = "jigd"
path = "main.rs"

[dependencies]
blake3             = "1.8"
color-eyre         = { default-features = false, version = "0.6" }
eyre               = "0.6"
rustix             = { features = [ "event", "fs", "net" ], version = "1" }
signal-hook        = { default-features = false, version = "0.3" }
tracing            = { default-features = false, features = [ "std" ], version = "0.1" }
tracing-subscriber = { default-features = false, features = [ "fmt", "ansi" ], version = "0.3" }

[lints.clippy]
cargo    = { level = "warn", priority = -1 }
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

blanket_clippy_restriction_lints = "allow"
restriction                      = { level = "warn", priority = -1 }

cargo_common_metadata = "allow"

absolute_paths                  = "allow"
allow_attributes                = "allow"
allow_attributes_without_reason = "allow"
arbitrary_source_item_ordering  = "allow"
arithmetic_side_effects         = "allow"
as_conversions                  = "allow"
big_endian_bytes                = "allow"
cast_possible_truncation        = "allow"
cast_possible_wrap              = "allow"
cast_sign_loss                  = "allow"
cognitive_complexity            = "allow"
decimal_literal_representation  = "allow"
default_numeric_fallback        = "allow"
else_if_without_else            = "allow"
error_impl_error                = "allow"
exhaustive_enums                = "allow"
exhaustive_structs              = "allow"
expect_used                     = "allow"
float_arithmetic                = "allow"
host_endian_bytes               = "allow"
implicit_return                 = "allow"
indexing_slicing                = "allow"
infinite_loop                   = "allow"
inline_modules                  = "allow"
inline_trait_bounds             = "allow"
integer_division                = "allow"
integer_division_remainder_used = "allow"
iter_over_hash_type             = "allow"
let_underscore_must_use         = "allow"
let_underscore_untyped          = "allow"
little_endian_bytes             = "allow"
map_err_ignore                  = "allow"
match_same_arms                 = "allow"
min_ident_chars                 = "allow"
missing_docs_in_private_items   = "allow"
missing_errors_doc              = "allow"
missing_inline_in_public_items  = "allow"
missing_panics_doc              = "allow"
missing_trait_methods           = "allow"
mod_module_files                = "allow"
module_name_repetitions         = "allow"
modulo_arithmetic               = "allow"
multiple_bound_locations        = "allow"
multiple_crate_versions         = "allow"
multiple_unsafe_ops_per_block   = "allow"
needless_borrowed_reference     = "allow"
needless_raw_strings            = "allow"
non_ascii_literal               = "allow"
pattern_type_mismatch           = "allow"
pub_use                         = "allow"
pub_with_shorthand              = "allow"
question_mark_used              = "allow"
redundant_test_prefix           = "allow"
redundant_type_annotations      = "allow"
ref_patterns                    = "allow"
result_large_err                = "allow"
semicolon_outside_block         = "allow"
separated_literal_suffix        = "allow"
shadow_reuse                    = "allow"
shadow_unrelated                = "allow"
significant_drop_tightening     = "allow"
similar_names                   = "allow"
single_call_fn                  = "allow"
single_char_lifetime_names      = "allow"
std_instead_of_alloc            = "allow"
std_instead_of_core             = "allow"
string_slice                    = "allow"
too_many_lines                  = "allow"
unimplemented                   = "allow"
unreachable                     = "allow"
unreadable_literal              = "allow"
unseparated_literal_suffix      = "allow"
unused_trait_names              = "allow"
unwrap_in_result                = "allow"
unwrap_used                     = "allow"
wildcard_enum_match_arm         = "allow"
