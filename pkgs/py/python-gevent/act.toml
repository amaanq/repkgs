track = "pypi:gevent"
fetch = { sdist = true }
with = [ "python" ]
deps = [
  "c-ares",
  "libev",
  "libuv",
  "python-cffi",
  "python-greenlet",
  "python-zope-event",
  "python-zope-interface",
]
tools = [ "python-cffi", "python-cython", "python-setuptools", "pkgconf" ]
env = { GEVENTSETUP_EMBED = "0" }
patches = [
  "fileobjectthread-finalizing.patch",
  "getaddrinfo-import-localhost.patch",
  "ssl-certificate-handler-pool.patch",
  "timer-resolution-quiet-socket.patch",
]

[test]
deps = [ "python-objgraph", "python-psutil" ]

[steps.after]
"python.test" = [ "python-gevent.test" ]

[python]
module = "gevent"
