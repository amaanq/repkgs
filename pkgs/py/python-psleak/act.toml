track = "pypi:psleak"
fetch = { url = "https://files.pythonhosted.org/packages/source/p/psleak/psleak-{version}.tar.gz" }
with  = [ "python" ]
deps  = [ "python-psutil" ]
tools = [ "python-setuptools" ]

[test]
deps = [ "python-pytest", "python-pytest-instafail" ]

[steps.before]
"python.test" = [ "python-psleak.test" ]

[python]
module = "psleak"
pytest = true
