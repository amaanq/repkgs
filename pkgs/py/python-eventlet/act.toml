track = "pypi:eventlet"
fetch = { sdist = true }
with  = [ "python" ]
deps  = [ "python-dnspython", "python-greenlet" ]
tools = [ "python-hatchling", "python-hatch-vcs" ]

[test]
deps = [ "python-pytest", "iana-etc" ]
etc  = true

[steps.before]
"python.test" = [ "python-eventlet.etc" ]

[python]
module = "eventlet"
pytest = true
