[upstream]
purl = "pkg:github/bdwgc/bdwgc"

[[source]]
key  = "default"
url  = "https://github.com/bdwgc/bdwgc/releases/download/v{version}/gc-{version}.tar.gz"
hash = "sha256-kerfViIXplH19xkUCA+kvSqTc1BGlPfSngEZWyxdt24="

[pin]
version = "8.2.12"
date    = "2026-02-05"
tag     = "v8.2.12"

[build]
systems = [ "cmake" ]

[build.cc]
cflags = [ "-DINITIAL_MARK_STACK_SIZE=1048576" ]

[build.cmake.defs]
enable_cplusplus    = true
enable_docs         = false
enable_large_config = true
enable_mmap         = true
