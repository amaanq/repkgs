[upstream]
# the fork carries the CA and dynamic-derivation fixes this set relies on (nix/nix/default.nix)
purl = "pkg:github/Mic92/nix-1?branch=repkgs"
# what the branch calls itself in .version, its own tags run past 2.90
base = "2.36.0"

[[source]]
key  = "default"
url  = "https://github.com/Mic92/nix-1/archive/{rev}.tar.gz"
hash = "sha256-XVtq1d7UwIj4/J3g1uaQkEq6bdu0p85JHZEFlm9qukg="

[pin]
version = "2.36.0-unstable-2026-09-16"
rev     = "e6c24e710343d0485995d1a67c6f4971d698bbca"
date    = "2026-09-16"

[build]
check = false
needs = [
  "bzip2",
  "curl",
  "libarchive",
  "openssl",
  "sqlite",
  "xz",
  "zlib",
  "zstd",
  "bdw-gc",
  "blake3",
  "boost",
  "libsodium",
  "lowdown",
  "brotli",
  "nlohmann-json",
  "libgit2",
  "toml11",
  "editline",
  "mimalloc",
]
patches = [ "relocatable.patch", "sandbox-shell-undef.patch" ]
systems = [ "meson" ]
tools = [ "bison", "cmake", "flex" ]

[build.meson.defs]
doc-gen            = false
functional-tests   = false
json-schema-checks = false
"nix:mimalloc"     = "enabled"
unit-tests         = false
