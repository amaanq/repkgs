fetch = { url = "https://github.com/Mic92/nix-1/archive/{rev}.tar.gz" }
with = [ "meson" ]
deps = [
  "bzip2",
  "curl",
  "libarchive",
  "openssl",
  "sqlite",
  "xz",
  "zlib",
  "zstd",
  "bdw-gc",
  "blake3",
  "boost",
  "libsodium",
  "lowdown",
  "brotli",
  "nlohmann-json",
  "libgit2",
  "toml11",
  "editline",
  "mimalloc",
  "googletest",
  "rapidcheck",
]
tools = [ "bison", "cmake", "flex", "util-linux" ]
patches = [ "relocatable.patch", "sandbox-shell-undef.patch" ]
remove = [
  "bin/nix-*-tests",
  "include/nix/*/tests",
  "lib/libnix*-test-support.so*",
  "lib/pkgconfig/nix-*-test-support.pc",
]

[track]
from = "github:Mic92/nix-1?branch=repkgs"
base = "2.36.0"

[meson.defs]
doc-gen            = false
functional-tests   = false
json-schema-checks = false
"nix:mimalloc"     = "enabled"

[test]
deps     = [ "git", "jq", "openssh", "sqlite", "util-linux" ]
separate = true

[steps.after]
"meson.install" = [ "nix.test" ]
