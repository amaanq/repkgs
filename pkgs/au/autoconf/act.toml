track   = "gnu:autoconf"
fetch   = { url = "https://ftp.gnu.org/gnu/autoconf/autoconf-{version}.tar.xz" }
with    = [ "autotools" ]
tools   = [ "m4", "perl" ]
deps    = [ "m4", "perl", "bash" ]
test    = false
patches = [ "relocatable.patch" ]

[steps.after]
"autotools.install" = [ "autoconf.retarget-tools" ]

[steps.before]
"autotools.configure" = [ "autoconf.keep-man" ]
