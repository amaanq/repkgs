[upstream]
purl = "pkg:gnu/autoconf"

[[source]]
key  = "default"
url  = "https://ftp.gnu.org/gnu/autoconf/autoconf-{version}.tar.xz"
hash = "sha256-DgunLhP8sHUPe+v6s1X7OYc29hgVrZ1dWBF8mmYKKzU="

[pin]
version = "2.73"
date    = "2026-03-20"

[package]
patches      = [ "relocatable.patch" ]
uses         = [ "autotools" ]
dependencies = [ "m4", "perl", "bash" ]

[package.phases.after]
"autotools.install" = [ "autoconf.retarget-tools" ]

[package.phases.before]
"autotools.configure" = [ "autoconf.keep-man" ]

[package.tests]
run = false

[when.native]
buildDependencies = [ "{pkg:m4}", "{pkg:perl}" ]

[when.cross]
buildDependencies = [ "m4", "perl" ]
