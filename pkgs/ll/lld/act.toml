fetch = { from = "llvm" }
with  = [ "cmake" ]
deps  = [ "llvm", "zlib", "zstd" ]
tools = [ "cpython", "llvm" ]

[test]
bin = [ "ld.lld", "lld" ]
# under wine ld.lld.exe resolves to lld.exe, which then picks no flavor from its name
version = "lld -flavor gnu --version"

[steps.replace]
"cmake.test" = [ "llvm.test" ]

[cmake]
root = "lld"

[cmake.defs]
BUILD_SHARED_LIBS     = false
LLVM_INCLUDE_TESTS    = true
LLVM_LINK_LLVM_DYLIB  = true
LLVM_DIR              = "{pkg:llvm}/lib/cmake/llvm"
LLVM_TABLEGEN_EXE     = "{tool:llvm}/bin/llvm-tblgen"
LLVM_TOOLS_BINARY_DIR = "{tool:llvm}/bin"
