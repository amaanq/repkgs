tag = "llvmorg-{version}"
fetch = { asset = "llvm-project-{version}.src.tar.xz" }
with = [ "cmake" ]
deps = [ "zlib", "zstd" ]
tools = [ "cpython" ]
patches = [
  "../llvm/upstream-x86-vastart-stack-probe.patch",
  "../llvm/mummer-absent-log.patch",
  "../llvm/sandbox-setid-tests.patch",
  "../llvm/lit-test-marks.patch",
  "https://github.com/rust-lang/llvm-project/commit/abcef279cd33492fe8301c8873fc535fa4dbf0d5.patch",
  "m68k-update-tests.patch",
]

[track]
from  = "github:llvm/llvm-project"
allow = "==22.*"

[test]
bin = [ "llvm-config" ]

[steps.replace]
"cmake.test" = [ "llvm22.test" ]

[cmake]
root = "llvm"

[cmake.defs]
BUILD_SHARED_LIBS                  = false
LLVM_BUILD_LLVM_DYLIB              = true
LLVM_ENABLE_BINDINGS               = false
LLVM_ENABLE_LIBEDIT                = false
LLVM_ENABLE_LIBPFM                 = false
LLVM_ENABLE_LIBXML2                = false
LLVM_ENABLE_TERMINFO               = false
LLVM_ENABLE_ZLIB                   = "FORCE_ON"
LLVM_ENABLE_ZSTD                   = "FORCE_ON"
LLVM_INCLUDE_BENCHMARKS            = false
LLVM_INCLUDE_DOCS                  = false
LLVM_INCLUDE_EXAMPLES              = false
LLVM_INCLUDE_TESTS                 = true
LLVM_INSTALL_GTEST                 = true
LLVM_INSTALL_UTILS                 = true
LLVM_LINK_LLVM_DYLIB               = true
LLVM_TARGETS_TO_BUILD              = "all"
LLVM_EXPERIMENTAL_TARGETS_TO_BUILD = "all"

[on.cross.steps.after]
"cmake.install" = [ "llvm22.host-config" ]

[on.cross.cmake.defs]
CROSS_TOOLCHAIN_FLAGS_NATIVE = [
  "-DCMAKE_C_COMPILER=cc-build",
  "-DCMAKE_CXX_COMPILER=c++-build",
  "-DCMAKE_EXE_LINKER_FLAGS=-static",
  "-DLLVM_BUILD_LLVM_DYLIB=ON",
  "-DLLVM_LINK_LLVM_DYLIB=ON",
  "-DLLVM_HOST_TRIPLE={platform:clangTarget}",
]
