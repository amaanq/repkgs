tag = "llvmorg-{version}"
fetch = { asset = "llvm-project-{version}.src.tar.xz" }
with = [ "cmake" ]
deps = [ "zlib", "zstd" ]
tools = [ "cpython" ]
patches = [
  "../llvm/upstream-x86-vastart-stack-probe.patch",
  "../llvm/mummer-absent-log.patch",
  "https://github.com/rust-lang/llvm-project/commit/abcef279cd33492fe8301c8873fc535fa4dbf0d5.patch",
]

[track]
from  = "github:llvm/llvm-project"
allow = "==22.*"

[test]
bin = [ "llvm-config" ]
run = false

[cmake]
root = "llvm"

[cmake.defs]
BUILD_SHARED_LIBS       = false
LLVM_BUILD_LLVM_DYLIB   = true
LLVM_ENABLE_BINDINGS    = false
LLVM_ENABLE_LIBEDIT     = false
LLVM_ENABLE_LIBPFM      = false
LLVM_ENABLE_LIBXML2     = false
LLVM_ENABLE_TERMINFO    = false
LLVM_ENABLE_ZLIB        = "FORCE_ON"
LLVM_ENABLE_ZSTD        = "FORCE_ON"
LLVM_INCLUDE_BENCHMARKS = false
LLVM_INCLUDE_DOCS       = false
LLVM_INCLUDE_EXAMPLES   = false
LLVM_INCLUDE_TESTS      = false
LLVM_INSTALL_UTILS      = false
LLVM_LINK_LLVM_DYLIB    = true
LLVM_TARGETS_TO_BUILD   = "all"
