fetch = { from = "llvm22" }
with  = [ "cmake" ]
deps  = [ "llvm22", "zlib", "zstd" ]
tools = [ "cpython", "llvm22" ]

[test]
bin     = [ "ld.lld", "lld" ]
run     = false
version = "lld -flavor gnu --version" # under wine ld.lld.exe resolves to lld.exe

[steps]
skip = [ "cmake.test" ]

[cmake]
root = "lld"

[cmake.defs]
BUILD_SHARED_LIBS     = false
LLVM_INCLUDE_TESTS    = false
LLVM_LINK_LLVM_DYLIB  = true
LLVM_DIR              = "{pkg:llvm22}/lib/cmake/llvm"
LLVM_TABLEGEN_EXE     = "{tool:llvm22}/bin/llvm-tblgen"
LLVM_TOOLS_BINARY_DIR = "{tool:llvm22}/bin"
