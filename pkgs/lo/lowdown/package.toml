[upstream]
purl = "pkg:github/kristapsdz/lowdown"

[[source]]
key  = "default"
url  = "https://github.com/kristapsdz/lowdown/archive/refs/tags/{tag}.tar.gz"
hash = "sha256-myVdHTR+XPaB5WCoJhH34WuWtW9oJykykj2dW8p1RG8="

[pin]
version = "3.1.1"
date    = "2026-07-19"
tag     = "VERSION_3_1_1"

[package]
patches = [ "upstream-portable-make.patch" ]
uses    = [ "make" ]
bin     = [ "lowdown", "lowdown-diff" ]

[package.platforms]
posix = true

[package.make]
configureScript = "none"
installTarget   = [ "install", "install_shared" ]
testTarget      = [ "regress" ]

[package.phases.before]
"make.build" = [ "lowdown.configure" ]
