[upstream]
purl = "pkg:generic/postgresql?url=https://ftp.postgresql.org/pub/source/&regex=v([0-9.]+)/"

[[source]]
key  = "default"
url  = "https://ftp.postgresql.org/pub/source/v{version}/postgresql-{version}.tar.bz2"
hash = "sha256-ySffxlG7jlNyzx++BmIN+WuaQ9TMAJt/qER9wIjd6B8="

[pin]
version = "18.6"

[build]
check   = false
needs   = [ "openssl", "zlib", "readline", "icu", "util-linux" ]
patches = [ "tzdir-etc-zoneinfo.patch" ]
systems = [ "meson" ]
tools   = [ "bison", "flex", "perl" ]

[build.after]
"meson.install" = [ "postgresql.relocate-pgxs" ]

[build.before]
"meson.configure" = [ "postgresql.fixed-paths" ]

[build.meson.defs]
icu           = "enabled"
readline      = "enabled"
rpath         = false
ssl           = "openssl"
system_tzdata = "/usr/share/zoneinfo"
uuid          = "e2fs"
zlib          = "enabled"
