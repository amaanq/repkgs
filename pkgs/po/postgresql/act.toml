track = "generic:postgresql?url=https://ftp.postgresql.org/pub/source/&regex=v([0-9.]+)/"
fetch = { url = "https://ftp.postgresql.org/pub/source/v{version}/postgresql-{version}.tar.bz2" }
with  = [ "meson" ]
deps  = [
  "openssl",
  "zlib",
  "readline",
  "icu",
  "util-linux",
  "lz4",
  "zstd",
  "libxml2",
  "curl",
  "krb5",
  "libxslt",
  "linux-pam",
  "numactl",
  "systemd",
]
tools = [ "bison", "flex", "perl", "tzdata", "gettext" ]
test  = false

[steps.after]
"meson.install" = [ "postgresql.relocate-pgxs" ]

[steps.before]
"meson.configure" = [ "postgresql.fixed-paths" ]

[meson.defs]
bonjour   = "disabled"
bsd_auth  = "disabled"
docs      = "disabled"
docs_pdf  = "disabled"
icu       = "enabled"
ldap      = "disabled"
liburing  = "disabled"
libxml    = "enabled"
lz4       = "enabled"
nls       = "enabled"
plperl    = "disabled"
plpython  = "disabled"
pltcl     = "disabled"
readline  = "enabled"
rpath     = false
selinux   = "disabled"
ssl       = "openssl"
tap_tests = "disabled"
uuid      = "e2fs"
zlib      = "enabled"
zstd      = "enabled"
