track = "generic:postgresql?url=https://ftp.postgresql.org/pub/source/&regex=v([0-9.]+)/"
fetch = { url = "https://ftp.postgresql.org/pub/source/v{version}/postgresql-{version}.tar.bz2" }
with  = [ "meson" ]
deps  = [ "openssl", "zlib", "readline", "icu", "util-linux", "lz4", "zstd", "libxml2" ]
tools = [ "bison", "flex", "perl", "tzdata" ]
test  = false

[steps.after]
"meson.install" = [ "postgresql.relocate-pgxs" ]

[steps.before]
"meson.configure" = [ "postgresql.fixed-paths" ]

[meson.defs]
icu      = "enabled"
libxml   = "enabled"
lz4      = "enabled"
readline = "enabled"
rpath    = false
ssl      = "openssl"
uuid     = "e2fs"
zlib     = "enabled"
zstd     = "enabled"
