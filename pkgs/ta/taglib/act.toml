tag     = "v{version}"
track   = "github:taglib/taglib"
fetch   = { archive = true }
with    = [ "cmake" ]
deps    = [ "zlib", "utf8cpp" ]
test    = false
patches = [ "relocatable.patch" ]

[cmake.defs]
WITH_ZLIB = true

[bindings]
go      = [ "github.com/deluan/go-taglib", "go.senan.xyz/taglib" ]
hackage = [ "htaglib", "libtagc", "taglib", "taglib-api" ]
