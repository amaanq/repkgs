[package]
name                   = "hoist"
description            = "Build script executor for manicpkgs"
license                = "EUPL-1.2"
repository             = "https://github.com/manic-systems/manicpkgs"
keywords               = [ "build", "nix", "bootstrap" ]
categories             = [ "command-line-utilities", "development-tools" ]
version.workspace      = true
edition.workspace      = true
readme.workspace       = true
rust-version.workspace = true

[dependencies]
blake3     = { workspace = true }
color-eyre = { workspace = true }
eyre       = { workspace = true }
glob       = "0.3"
shim       = { workspace = true }
pound      = "0.1.7"
roxmltree  = "0.20"
serde      = { features = [ "derive" ], version = "1" }
serde_json = "1"
wire       = { workspace = true }

[lints]
workspace = true
