track = 'generic:krb5?url=https://kerberos.org/dist/&regex=krb5-([0-9.]+)\.tar'
fetch = { url = "https://kerberos.org/dist/krb5/{major}.{minor}/krb5-{version}.tar.gz" }
with = [ "autotools" ]
deps = [ "openssl" ]
tools = [ "bison", "perl" ]
patches = [
  "CVE-2026-11850.patch",
  "CVE-2026-40355-and-CVE-2026-40356.patch",
  "upstream-libdb2-test-dictionary-file.patch",
  "upstream-kpropd-loopback-only-listen.patch",
  "relocatable.patch",
]

[test]
parallel = false

[steps.after]
"autotools.install" = [ "krb5.relocate-compile-et" ]

[only]
os = [ "linux", "macos" ]

[autotools]
flags = [
  "--with-crypto-impl=openssl",
  "--sysconfdir=/etc",
  "--localstatedir=/var",
  "--runstatedir=/run",
  "CFLAGS=-std=gnu17",
  "krb5_cv_cc_flag__dash_Werror_eq_incompatible_dash_pointer_dash_types=no",
]
outOfTree = false
root = "src"
