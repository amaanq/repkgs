[upstream]
purl = 'pkg:generic/krb5?url=https://kerberos.org/dist/&regex=krb5-([0-9.]+)\.tar'

[[source]]
key  = "default"
url  = "https://kerberos.org/dist/krb5/{major}.{minor}/krb5-{version}.tar.gz"
hash = "sha256-hbb3S5Ddh1MMShrmjmkEimcBi1dmxIvc2mfgYAdvMSU="

[pin]
version = "1.22.2"

[build]
needs = [ "openssl" ]
patches = [
  "upstream-libdb2-test-dictionary-file.patch",
  "upstream-kpropd-loopback-only-listen.patch",
  "relocatable.patch",
]
systems = [ "autotools" ]
tools = [ "bison", "perl" ]

[build.after]
"autotools.install" = [ "krb5.relocate-compile-et" ]

[build.autotools]
flags = [
  "--with-crypto-impl=openssl",
  "--sysconfdir=/etc",
  "--localstatedir=/var",
  "--runstatedir=/run",
  "krb5_cv_cc_flag__dash_Werror_eq_incompatible_dash_pointer_dash_types=no",
]
outOfTree = false
root = "src"

[build.check]
parallel = false

[build.targets]
os = [ "linux", "macos" ]
