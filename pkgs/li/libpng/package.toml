[upstream]
purl = "pkg:github/pnggroup/libpng"

[[source]]
key  = "default"
url  = "https://downloads.sourceforge.net/libpng/libpng-{version}.tar.xz"
hash = "sha256-JSdzPsfRBjnk8DB/fkOCkaiUJ9/neQ2myIK5xnQuSsM="

[pin]
version = "1.6.58"

[package]
patches      = [ "upstream-cmake-install-pc-when-generated.patch" ]
uses         = [ "cmake" ]
dependencies = [ "zlib" ]

[package.cmake.defs]
PNG_STATIC = false
PNG_TOOLS  = true
