tag   = "libssh2-{version}"
track = "github:libssh2/libssh2"
fetch = { url = "https://www.libssh2.org/download/libssh2-{version}.tar.gz" }
with  = [ "cmake" ]
deps  = [ "openssl", "zlib" ]
test  = false

# curl links libssh2, and the full cmake links curl
patches = [
  "01-CVE-2026-7598.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/1d4906e6ebe85a9da2931ba33677ead96a61f07f/debian/patches/libssh-unconst-backport.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/1d4906e6ebe85a9da2931ba33677ead96a61f07f/debian/patches/CVE-2025-15661.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/1d4906e6ebe85a9da2931ba33677ead96a61f07f/debian/patches/CVE-2026-55199.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/1d4906e6ebe85a9da2931ba33677ead96a61f07f/debian/patches/CVE-2026-55200.patch",
  "https://github.com/JuliaPackaging/Yggdrasil/raw/9404aa5dd96c945a790c425a5f49af19ed2a93b0/L/LibSSH2/LibSSH2%401.11/bundled/patches/CVE-2026-58051-a9758da.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/fe2e3c0848f8501bf729d61790360761a20c75f2/debian/patches/CVE-2026-66032.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/fe2e3c0848f8501bf729d61790360761a20c75f2/debian/patches/CVE-2026-66033.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/fe2e3c0848f8501bf729d61790360761a20c75f2/debian/patches/CVE-2026-66034.patch",
  "https://salsa.debian.org/debian/libssh2/-/raw/fe2e3c0848f8501bf729d61790360761a20c75f2/debian/patches/CVE-2026-66035.patch",
]
[cmake]
tool = "cmake-bootstrap"

[cmake.defs]
BUILD_EXAMPLES          = false
CRYPTO_BACKEND          = "OpenSSL"
ENABLE_ZLIB_COMPRESSION = true

[bindings]
hackage = [ "libssh2", "simplessh" ]

[bindings.cargo]
names = [ "libssh2-sys" ]
env   = { LIBSSH2_SYS_USE_PKG_CONFIG = "1" }
