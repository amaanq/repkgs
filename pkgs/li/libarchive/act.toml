tag   = "v{version}"
track = "github:libarchive/libarchive"
fetch = { url = "https://github.com/libarchive/libarchive/releases/download/v{version}/libarchive-{version}.tar.xz" }
with  = [ "cmake" ]
patches = [ "setid-perms-test.patch" ]
deps  = [ "zlib", "bzip2", "xz", "zstd", "lz4", "expat", "libxml2", "openssl" ]

[test]
bin      = [ "bsdtar", "bsdcpio", "bsdunzip" ]
separate = true

[steps.before]
"cmake.test" = [ "libarchive.locale" ]

[cmake]
tool = "cmake-bootstrap"

[cmake.defs]
ENABLE_ACL     = false
ENABLE_EXPAT   = true
ENABLE_LIBXML2 = true
ENABLE_OPENSSL = true
ENABLE_XATTR   = false

[on.linux]
deps = [ "acl", "attr" ]

[on.linux.cmake.defs]
ENABLE_ACL   = true
ENABLE_XATTR = true

[bindings]
cargo   = [ "libarchive3-sys" ]
hackage = [ "libarchive" ]
