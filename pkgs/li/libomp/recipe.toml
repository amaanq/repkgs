[upstream]
purl  = "pkg:github/llvm/llvm-project"
allow = ">=23"

[[source]]
key  = "default"
url  = "https://github.com/llvm/llvm-project/releases/download/{tag}/llvm-project-{version}.src.tar.xz"
hash = "sha256-iAcWcsfrEk2V9siWaMcUBzSBLcCh7oubhorrKmh/EBg="

[pin]
version = "23.1.1"
tag     = "llvmorg-23.1.1"
date    = "2025-12-16"

[build]
check   = false
systems = [ "cmake" ]
tools   = [ "cpython" ]

[build.cmake]
root = "runtimes"

[build.cmake.defs]
LIBOMP_INSTALL_ALIASES     = false
LIBOMP_OMPD_SUPPORT        = false
LLVM_ENABLE_RUNTIMES       = "openmp"
LLVM_INCLUDE_TESTS         = false
OPENMP_ENABLE_LIBOMPTARGET = false
OPENMP_ENABLE_OMPT_TOOLS   = false
OPENMP_ENABLE_TESTING      = false
