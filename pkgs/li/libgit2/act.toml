tag   = "v{version}"
track = "github:libgit2/libgit2"
fetch = { archive = true }
with  = [ "cmake" ]
deps  = [ "openssl", "pcre2", "zlib", "libssh2" ]
tools = [ "pkgconf" ]
test  = false

[cmake.defs]
BUILD_CLI     = false
BUILD_TESTS   = false
REGEX_BACKEND = "pcre2"
USE_SSH       = "libssh2"

[bindings.cargo]
names = [ "libgit2-sys" ]
env   = { LIBGIT2_NO_VENDOR = "1" }

[bindings.python]
names = [ "pygit2" ]
env   = { LIBGIT2 = "{root}" }

[bindings.gems]
flags.rugged = [ "--use-system-libraries" ]
