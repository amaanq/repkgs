track = "generic:libcap?url=https://kernel.org/pub/linux/libs/security/linux-privs/libcap2/"
fetch = { url = "https://kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-{version}.tar.xz" }
with  = [ "make" ]
tools = [ "bash" ]

[only]
os = [ "linux" ]

[make]
flags      = [ "lib=lib", "sbin=bin", "CC=cc", "GOLANG=no", "PAM_CAP=no", "RAISE_SETFCAP=no" ]
testTarget = [ "test" ]

[on.cross.make]
flags = [ "BUILD_CC=cc-build" ]
