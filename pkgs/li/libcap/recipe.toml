[upstream]
purl = "pkg:generic/libcap?url=https://kernel.org/pub/linux/libs/security/linux-privs/libcap2/"

[[source]]
key  = "default"
url  = "https://kernel.org/pub/linux/libs/security/linux-privs/libcap2/libcap-{version}.tar.xz"
hash = "sha256-j9JumpYzLJnMbKADOt6ADub8SAad8y55aWsFxtytPqg="

[pin]
version = "2.78"

[build]
systems = [ "make" ]
tools   = [ "bash" ]

[build.after]
"make.test" = [ "libcap.test" ]

[build.make]
flags      = [ "lib=lib", "sbin=bin", "CC=cc", "GOLANG=no", "PAM_CAP=no", "RAISE_SETFCAP=no" ]
testTarget = [ "-C", "libcap", "cap_test" ]

[build.targets]
os = [ "linux" ]
