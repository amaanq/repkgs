track   = 'generic:libdrm?url=https://dri.freedesktop.org/libdrm/&regex=libdrm-([0-9.]+)\.tar\.xz'
fetch   = { url = "https://dri.freedesktop.org/libdrm/libdrm-{version}.tar.xz" }
with    = [ "meson" ]
tools   = [ "cpython314" ]
patches = [ "relocatable.patch", "llvm-nm-weak.patch" ]

[only]
os = [ "linux" ]

[meson.defs]
install-test-programs = true
radeon                = "enabled"
amdgpu                = "enabled"
nouveau               = "enabled"
cairo-tests           = "disabled"
intel                 = "disabled"
man-pages             = "disabled"
valgrind              = "disabled"

[on.x86_64]
deps = [ "libpciaccess" ]

[on.x86_64.meson.defs]
intel  = "enabled"
vmwgfx = "enabled"

[on.aarch64.meson.defs]
etnaviv   = "enabled"
exynos    = "enabled"
freedreno = "enabled"
omap      = "enabled"
tegra     = "enabled"
vc4       = "enabled"
