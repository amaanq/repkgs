tag   = "libevdev-{version}"
track = "gitlab:libevdev/libevdev?repository_url=https://gitlab.freedesktop.org"
fetch = { url = "https://www.freedesktop.org/software/libevdev/libevdev-{version}.tar.xz" }
with  = [ "meson" ]
deps  = [ "check" ]
tools = [ "cpython" ]

[only]
os = [ "linux" ]

[meson.defs]
documentation = "disabled"
tests         = "enabled"
