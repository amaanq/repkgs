tag     = "v{version}"
track   = "github:libffi/libffi"
fetch   = { asset = "libffi-{version}.tar.gz" }
with    = [ "autotools" ]
patches = [ "cached-warning-flags.patch" ]

[on.macos.autotools]
flags = [ "--disable-symvers" ]

[on.windows.autotools]
flags = [ "--disable-symvers" ]

[bindings]
python  = [ "cffi" ]
hackage = [ "bindings-libffi" ]

[bindings.cargo]
names = [ "libffi-sys" ]
env   = { LIBFFI_SYS_USE_PKG_CONFIG = "1" }

[bindings.gems]
flags.ffi = [ "--enable-system-libffi" ]
