tag     = "v{version}"
track   = "github:libuv/libuv"
fetch   = { url = "https://dist.libuv.org/dist/v{version}/libuv-v{version}.tar.gz" }
with    = [ "cmake" ]
patches = [ "unmapped-root.patch", "parallel-ctest.patch" ]

[cmake]
tool = "cmake-bootstrap"

[on.msvc]
remove = [ "lib/libuv.lib", "lib/pkgconfig/libuv-static.pc" ]

[bindings]
hackage = [ "stdio" ]

[bindings.python]
configSettings.uvloop.--build-option = "--use-system-libuv"
