fetch  = { url = "https://download.gnome.org/sources/libxslt/{major}.{minor}/libxslt-{version}.tar.xz" }
with   = [ "autotools" ]
deps   = [ "libxml2" ]
# the sourced shell fragment cannot find itself, libxml2 dropped its xml2Conf.sh twin as outdated
remove = [ "lib/xsltConf.sh" ]

[track]
from = "generic:libxslt"

[track.watch]
url   = "https://download.gnome.org/sources/libxslt/cache.json"
regex = 'libxslt-([0-9]+\.[0-9]+\.[0-9]+)\.tar'

[test]
bin = [ "xslt-config" ]

[autotools]
flags = [ "--without-python", "--without-crypto" ]
