tag     = "v{version}"
track   = "github:elixir-lang/elixir"
fetch   = { archive = true }
with    = [ "make" ]
deps    = [ "erlang", "coreutils", "sed", "curl", "bash" ]
tools   = [ "erlang" ]
exports = false
patches = [ "async-stream-timeout-margin.patch", "format-exit-call-race.patch" ]

[test]
bin = [ "elixir", "elixirc", "mix", "iex" ]

[env]
ELIXIR_ASSERT_TIMEOUT = "2000"
ERL_COMPILER_OPTIONS  = "deterministic"

[make]
testTarget = [ "test_stdlib" ]
