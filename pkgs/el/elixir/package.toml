[upstream]
purl = "pkg:github/elixir-lang/elixir"

[[source]]
key  = "default"
url  = "https://github.com/elixir-lang/elixir/archive/refs/tags/{tag}.tar.gz"
hash = "sha256-Z/lAmD3wyiTnX2e7n2gHELkTpZ3AgGSjqNmvDxCH91g="

[pin]
version = "1.20.4"
tag     = "v1.20.4"
date    = "2026-08-28"

[package]
uses         = [ "make" ]
dependencies = [ "erlang", "coreutils", "sed" ]
bin          = [ "elixir", "elixirc", "mix", "iex" ]
exports      = false

[package.make]
testTarget = [ "test_stdlib" ]

[package.env]
ERL_COMPILER_OPTIONS = "deterministic"

[when.native]
buildDependencies = [ "{pkg:erlang}" ]

[when.cross]
buildDependencies = [ "erlang" ]
