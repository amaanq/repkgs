[package]
name                   = "mummerd"
description            = "Compilation cache and compiler slot daemon for motley"
license                = "EUPL-1.2"
repository             = "https://github.com/manic-systems/motley"
keywords               = [ "cache", "compiler", "nix", "bootstrap" ]
categories             = [ "command-line-utilities", "development-tools" ]
version.workspace      = true
edition.workspace      = true
readme.workspace       = true
rust-version.workspace = true

[dependencies]
blake3      = { workspace = true }
color-eyre  = { workspace = true }
eyre        = { workspace = true }
pound       = "0.1.7"
rustix      = { features = [ "process" ], workspace = true }
signal-hook = { default-features = false, version = "0.3" }
tempfile    = "3"
tightrope   = { workspace = true }

[lints]
workspace = true
