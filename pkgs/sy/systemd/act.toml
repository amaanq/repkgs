tag     = "v{version}"
track   = "github:systemd/systemd"
fetch   = { archive = true }
with    = [ "meson" ]
deps    = [ "util-linux" ]
tools   = [ "bash", "gperf", "cpython314", "python-jinja2" ]
patches = [ "relocatable.patch", "journal-tests-tmpdir.patch" ]

[only]
os = [ "linux" ]

[test]
etc = true

[steps.before]
"meson.test" = [ "systemd.machine-id" ]

[meson]
installTags = [ "devel", "libsystemd", "libudev" ]
suites      = [ "libsystemd", "libudev" ]

[meson.defs]
acl                      = "disabled"
analyze                  = false
apparmor                 = "disabled"
audit                    = "disabled"
backlight                = false
binfmt                   = false
blkid                    = "disabled"
bootloader               = "disabled"
bpf-framework            = "disabled"
bzip2                    = "disabled"
compat-sysv-interfaces   = false
coredump                 = false
create-log-dirs          = false
dbus                     = "disabled"
efi                      = false
elfutils                 = "disabled"
environment-d            = false
fdisk                    = "disabled"
firstboot                = false
fuzz-tests               = false
gcrypt                   = "disabled"
glib                     = "disabled"
gnutls                   = "disabled"
hibernate                = false
homed                    = "disabled"
hostnamed                = false
hwdb                     = false
idn                      = false
ima                      = false
imds                     = "disabled"
importd                  = "disabled"
initrd                   = false
install-sysconfdir       = false
ipe                      = false
kernel-install           = false
kmod                     = "disabled"
ldconfig                 = false
libarchive               = "disabled"
libcrypt                 = "disabled"
libcryptsetup            = "disabled"
libcryptsetup-plugins    = "disabled"
libcurl                  = "disabled"
libfido2                 = "disabled"
libidn2                  = "disabled"
libmount                 = "enabled"
localed                  = false
log-message-verification = "disabled"
logind                   = false
lz4                      = "disabled"
machined                 = false
microhttpd               = "disabled"
mode                     = "release"
mountfsd                 = false
networkd                 = false
nspawn                   = "disabled"
nsresourced              = false
nss-myhostname           = false
nss-mymachines           = "disabled"
nss-resolve              = "disabled"
nss-systemd              = false
oomd                     = false
openssl                  = "disabled"
p11kit                   = "disabled"
pam                      = "disabled"
passwdqc                 = "disabled"
pcre2                    = "disabled"
polkit                   = "disabled"
portabled                = false
pstore                   = false
pwquality                = "disabled"
qrencode                 = "disabled"
quotacheck               = false
randomseed               = false
remote                   = "disabled"
repart                   = "disabled"
resolve                  = false
rfkill                   = false
rpmmacrosdir             = "no"
seccomp                  = "disabled"
selinux                  = "disabled"
smack                    = false
split-bin                = "false"
sshconfdir               = "no"
sshdconfdir              = "no"
storagetm                = false
sysext                   = false
sysinstall               = false
sysupdate                = "disabled"
sysusers                 = false
timedated                = false
timesyncd                = false
tmpfiles                 = false
tpm                      = false
tpm2                     = "disabled"
translations             = false
ukify                    = "disabled"
userdb                   = false
utmp                     = false
vconsole                 = false
vcs-tag                  = false
vmspawn                  = "disabled"
xdg-autostart            = false
xenctrl                  = "disabled"
xkbcommon                = "disabled"
xz                       = "disabled"
zlib                     = "disabled"
zstd                     = "disabled"

[bindings]
cargo = [ "libsystemd-sys", "libudev-sys" ]
