tag = "v{version}"
track = "github:laurikari/tre"
fetch = { asset = "tre-{version}.tar.gz" }
with = [ "autotools" ]
patches = [
  "upstream-llp64-align.patch",
  "upstream-mingw-wchar.patch",
  "cached-warning-flags.patch",
]

[autotools]
flags = [ "--disable-agrep", "--enable-static" ]

[on.native.steps.before]
"autotools.test" = [ "tre.latin1" ]

[on.windows.steps.after]
"autotools.install" = [ "tre.posix-regex" ]

[on.windows.env]
SYSTRE = "{file:systre.c}"
