[upstream]
purl = "pkg:github/laurikari/tre"

[[source]]
key  = "default"
url  = "https://github.com/laurikari/tre/releases/download/{tag}/tre-{version}.tar.gz"
hash = "sha256-2ew5H+7ldyxuYbmac1qDObVBdWnA0KfdLqtQYT59jPg="

[pin]
version = "0.9.0"
tag     = "v0.9.0"

[package]
patches = [ "upstream-llp64-align.patch", "upstream-mingw-wchar.patch" ]
uses    = [ "autotools" ]

[package.autotools]
flags = [ "--disable-agrep", "--enable-static" ]

[package.phases.after]
"autotools.install" = [  ]

[package.phases.before]
"autotools.test" = [  ]

[when.os.windows.phases.after]
"autotools.install" = [ "tre.posix-regex" ]

[when.native.phases.before]
"autotools.test" = [ "tre.latin1" ]

[when.os.windows.env]
SYSTRE = "{file:systre.c}"
