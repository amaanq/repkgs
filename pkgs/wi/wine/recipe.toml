[upstream]
purl = "pkg:generic/wine"

[[source]]
key  = "default"
url  = "https://dl.winehq.org/wine/source/{major}.0/wine-{version}.tar.xz"
hash = "sha256-3jJ2paulqgMLyLR8g5bxwJuuusAMZSrnw+X+nFhYt+c="

[pin]
version = "11.0"

[watch]
url   = "https://dl.winehq.org/wine/source/"
regex = '([0-9]+\.0)/'

[build]
remove  = [ "lib/wine/x86_64-unix/wine-preloader" ]
systems = [ "autotools" ]
tools   = [ "flex", "bison" ]

[build.autotools]
flags = [
  "--prefix=/usr",
  "--enable-nls",
  "x86_64_CC=clang",
  "--enable-archs=x86_64",
  "--disable-tests",
  "--without-x",
  "--without-wayland",
  "--without-freetype",
  "--without-gstreamer",
  "--without-alsa",
  "--without-pulse",
  "--without-opengl",
  "--without-vulkan",
  "--without-cups",
  "--without-sane",
  "--without-gphoto",
  "--without-krb5",
  "--without-netapi",
  "--without-pcap",
  "--without-usb",
  "--without-v4l2",
  "--without-sdl",
  "--without-udev",
  "--without-dbus",
  "--without-gnutls",
  "--without-unwind",
]
installFlags = [ "prefix=$(out)" ]

[build.cc.hardening]
trivialautovarinit = false

[build.check]
version = "wine --version"

[build.targets]
cpu = [ "x86_64" ]
os  = [ "linux" ]
