fetch  = { url = "https://dl.winehq.org/wine/source/{major}.0/wine-{version}.tar.xz" }
with   = [ "autotools" ]
tools  = [ "flex", "bison" ]
remove = [ "lib/wine/x86_64-unix/wine-preloader" ]

[track]
from = "generic:wine"

[track.watch]
url   = "https://dl.winehq.org/wine/source/"
regex = '([0-9]+\.0)/'

[test]
version = "wine --version"

[only]
cpu = [ "x86_64" ]
os  = [ "linux" ]

[autotools]
flags = [
  "--prefix=/usr",
  "--enable-nls",
  "x86_64_CC=clang",
  "--enable-archs=x86_64",
  "--disable-tests",
  "--without-x",
  "--without-wayland",
  "--without-freetype",
  "--without-gstreamer",
  "--without-alsa",
  "--without-pulse",
  "--without-opengl",
  "--without-vulkan",
  "--without-cups",
  "--without-sane",
  "--without-gphoto",
  "--without-krb5",
  "--without-netapi",
  "--without-pcap",
  "--without-usb",
  "--without-v4l2",
  "--without-sdl",
  "--without-udev",
  "--without-dbus",
  "--without-gnutls",
  "--without-unwind",
]
installFlags = [ "prefix=$(out)" ]

[cc.hardening]
trivialautovarinit = false
