tag = "{version}"
track = "github:wild-linker/wild"
fetch = { archive = true }
with = [ "cargo" ]
tools = [ "taplo", "clang22" ]
patches = [
  "package-metadata.patch",
  "linker-script-directory.patch",
  "relr-version-definition.patch",
  "init-fini.patch",
  "hidden-symtab-local.patch",
  "https://github.com/wild-linker/wild/commit/b9c0dd643196aa628cd92ca34b93a3d177e5f526.patch",
  "binary-format.patch",
  "input-build-id.patch",
  "gotpcrel-addend.patch",
  "https://github.com/wild-linker/wild/commit/9ff20eaac96b17d87ae38cc6c06d3f8082f6bda5.patch",
  "undef-ifunc-type.patch",
  "null-section-flags.patch",
  "note-alignment.patch",
  "ehdr-symbols.patch",
  "no-gc-default.patch",
  "rela-plt-link.patch",
]

[test]
bin = [ "wild" ]

[cargo]
# the integration suite diffs each case against GNU ld, gcc and gold, and our cc drivers link with lld
# whatever -B names, so these cases test the reference toolchain instead of wild
skipTests = [
  "gcc",
  "/backtrace/eh-frame",
  "/comments/default",
  "/common-shared/default",
  "/compressed-debug-gdb-scripts/zlib",
  "/compressed-debug-gdb-scripts/zstd",
  "/compressed-debug-merge/none",
  "/compressed-debug-merge/zlib",
  "/compressed-debug-merge/zstd",
  "/cpp-integration/clang-crel",
  "/cpp-integration/clang-model-large",
  "/cpp-integration/clang-pie",
  "/cpp-integration/model-large",
  "/cpp-integration/no-pie",
  "/cpp-integration/pie",
  "/cpp-integration/static-no-relax",
  "/crtend-only-eh-frame/clang",
  "/ctors/default",
  "/custom-section/archive",
  "/custom-section/object",
  "/defsym/symbol_alias_lto",
  "/eh-frame/default",
  "/exception/clang",
  "/force-undefined/undefined",
  "/gdb-index-multi-cu/default",
  "/ifunc2/pie",
  "/ifunc-address-equality/no-pie",
  "/ifunc-export/ifunc-export",
  "/ifunc/pie",
  "/large-tbss/default",
  "/libc-ifunc/default",
  "/libc-integration/clang-global-dynamic",
  "/libc-integration/clang-initial-exec",
  "/libc-integration/clang-static",
  "/libc-integration/clang-static-pie",
  "/linker-script-assert-pass/default",
  "/linker-script-at/default",
  "/linker-script-executable/default",
  "/linker-script-executable/no_gc_sections",
  "/linker-script-location-counter/default",
  "/linker-script-location-counter/no_gc_sections",
  "/linker-script-location-counter/phdrs",
  "/linker-script-location-counter/single_location_counter",
  "/linker-script-location-counter/underflow",
  "/linker-script-phdrs/no-load",
  "/linker-script-region/region-overflow",
  "/linker-script-segment-start/no-overrides",
  "/linker-script-segment-start/with-T-overrides",
  "/linker-script-symbols/default",
  "/linker-script-symbols/lto",
  "/lto-whole-archive-shared/default",
  "/missing-custom-entry/default",
  "/mixed-verdef-verneed/default",
  "/new-dtags/old-dtags",
