  "/pie-invalid-reloc/default",
  "/relr-bitmap/x86_64",
  "/rust-integration-dynamic/default",
  "/rust-integration/llvm-dynamic",
  "/section-start/section-start",
  "/segment-end-syms/no-pie",
  "/segment-end-syms/pie",
  "/shlib-archive-activation/archive",
  "/sort-section-alignments/x86_64",
  "/sort-section-name/x86_64",
  "/source-info-from-debug/lto",
  "/string-merging/export_merged_str_dyn",
  "/symbol-versions/verdef-0",
