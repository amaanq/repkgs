tag   = "release-{version}"
track = "github:unicode-org/icu"
fetch = { url = "https://github.com/unicode-org/icu/releases/download/release-{version}/icu4c-{version}-sources.tgz" }
with  = [ "autotools" ]

[steps.after]
"autotools.install" = [ "icu.relative-prefix" ]

[autotools]
flags = [ "--disable-icu-config" ]
root  = "source"
