tag     = "release-{version}"
track   = "github:unicode-org/icu"
fetch   = { url = "https://github.com/unicode-org/icu/releases/download/release-{version}/icu4c-{version}-sources.tgz" }
with    = [ "autotools" ]
patches = [ "upstream-ssearch-snprintf-bound.patch" ]

[steps.after]
"autotools.install" = [ "icu.relative-prefix" ]

[autotools]
flags = [ "--disable-icu-config" ]
root  = "source"

[on.cross]
test  = false
tools = [ "icu" ]

[on.cross.autotools]
flags = [ "--with-cross-build=/build/native-icu" ]

[on.cross.steps.before]
"autotools.configure" = [ "icu.cross-buildroot" ]

[on.macos.autotools]
flags = [ "--enable-rpath" ]

[bindings]
hackage = [ "text-icu" ]

[bindings.gems]
flags.charlock_holmes = [ "--with-icu-dir={root}" ]
