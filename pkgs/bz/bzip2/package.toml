[upstream]
purl = "pkg:generic/bzip2?url=https://sourceware.org/pub/bzip2/"

[[source]]
key  = "default"
url  = "https://sourceware.org/pub/bzip2/bzip2-{version}.tar.gz"
hash = "sha256-Uvi4JZPPERK3gym4yoaeTEJwKXF5brBAEN7GgF+iF6g="

[pin]
version = "1.0.8"

[package]
uses = [ "make" ]

[package.platforms]
abi = [ "gnu", "apple" ]

[package.make]
buildTarget = [ "libbz2.a", "bzip2", "bzip2recover" ]
flags       = [ "CC=cc", "AR=llvm-ar", "RANLIB=llvm-ranlib", "CFLAGS=-O2 -fPIC" ]
programs    = [ "bzip2", "bzip2recover" ]
