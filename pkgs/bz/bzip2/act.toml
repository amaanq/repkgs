track   = "generic:bzip2?url=https://sourceware.org/pub/bzip2/"
fetch   = { url = "https://sourceware.org/pub/bzip2/bzip2-{version}.tar.gz" }
with    = [ "make" ]
patches = [ "CVE-2026-42250.patch" ]

[only]
abi = [ "gnu", "apple" ]

[make]
buildTarget = [ "libbz2.a", "bzip2", "bzip2recover" ]
flags       = [ "CC=cc", "AR=llvm-ar", "RANLIB=llvm-ranlib", "CFLAGS=-O2 -fPIC" ]
programs    = [ "bzip2", "bzip2recover" ]

[bindings]
hackage = [ "bzlib", "bzlib-conduit", "bzlib-conduit-jappie", "pipes-bzip" ]

[bindings.cargo]
names = [ "bzip2-sys" ]
env   = { BZIP2_SYS_USE_PKG_CONFIG = "1" }
