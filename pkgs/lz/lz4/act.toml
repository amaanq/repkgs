tag     = "v{version}"
fetch   = { archive = true }
with    = [ "cmake" ]
patches = [ "https://github.com/lz4/lz4/commit/f64efec011c058bd70348576438abac222fe6c82.patch" ]

[track]
from  = "github:lz4/lz4"
allow = "<100"

[cmake]
root = "build/cmake"
tool = "cmake-bootstrap"

[bindings]
cargo = [ "lz4-sys" ]
