tag   = "v{version}"
track = "github:nghttp2/nghttp2"
fetch = { url = "https://github.com/nghttp2/nghttp2/releases/download/v{version}/nghttp2-{version}.tar.xz" }
with  = [ "cmake" ]

[cmake]
tool = "cmake-bootstrap"

[cmake.defs]
BUILD_STATIC_LIBS = true
ENABLE_LIB_ONLY   = true

[bindings]
cargo = [ "libnghttp2-sys" ]
