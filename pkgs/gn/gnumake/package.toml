[upstream]
purl = "pkg:gnu/make"

[[source]]
key  = "default"
url  = "https://ftp.gnu.org/gnu/make/make-{version}.tar.gz"
hash = "sha256-+Cg7R8wougcWcFf6u5B3lVX6RRgMRYZ1CD+e21URP5A="

[pin]
version = "4.4.1"

[package]
patches        = [ "relocatable.patch" ]
uses           = [ "autotools" ]
bin            = [ "make" ]
bootstrapTools = true

[package.autotools]
flags     = [ "--without-guile" ]
makeFlags = [ "MAKEINFO=true" ]

[package.phases.before]
"autotools.test" = [ "gnumake.drop-general4" ]

[package.tests]
dependencies = [ "{tool:perl}" ]
separate     = true

[package.cc.hardening]
format = true

[when.os.windows.cc.hardening]
format = false
