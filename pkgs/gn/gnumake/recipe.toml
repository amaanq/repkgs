[upstream]
purl = "pkg:gnu/make"

[[source]]
key  = "default"
url  = "https://ftp.gnu.org/gnu/make/make-{version}.tar.gz"
hash = "sha256-+Cg7R8wougcWcFf6u5B3lVX6RRgMRYZ1CD+e21URP5A="

[pin]
version = "4.4.1"

[build]
bin            = [ "make" ]
bootstrapTools = true
patches        = [ "relocatable.patch" ]
systems        = [ "autotools" ]

[build.autotools]
flags     = [ "--without-guile" ]
makeFlags = [ "MAKEINFO=true" ]

[build.before]
"autotools.test" = [ "gnumake.drop-general4" ]

[build.cc.hardening]
format = true

[build.check]
separate = true
