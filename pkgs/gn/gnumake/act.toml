track          = "gnu:make"
fetch          = { url = "https://ftp.gnu.org/gnu/make/make-{version}.tar.gz" }
with           = [ "autotools" ]
bootstrapTools = true
patches        = [ "relocatable.patch" ]

[test]
bin      = [ "make" ]
separate = true
fhs      = true

[autotools]
flags     = [ "--without-guile" ]
makeFlags = [ "MAKEINFO=true" ]

[cc.hardening]
format = true
