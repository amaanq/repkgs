tag   = "v{version}"
track = "github:Kitware/CMake"
fetch = { asset = "cmake-{version}.tar.gz" }
with  = [ "make" ]

# cmake from the same tarball runs the suite
[test]
bin = [ "cmake", "ctest", "cpack" ]
run = false

[steps]
phases = [ "boot.configure", "make.build", "make.install" ]

[only]
cross = false
