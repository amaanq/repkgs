fetch   = { from = "cmake-bootstrap" }
with    = [ "cmake" ]
patches = [ "tests.patch" ]

[test]
bin  = [ "cmake", "ctest", "cpack" ]
deps = [ "openssl", "cpython314", "file" ]

[steps.before]
"cmake.test" = [ "test-tools.path" ]

[cmake]
tool = "cmake-bootstrap"

[cmake.defs]
CMAKE_USE_OPENSSL                   = false
CMake_TEST_NO_NETWORK               = true
CMAKE_USE_SYSTEM_LIBRARY_BZIP2      = true
CMAKE_USE_SYSTEM_LIBRARY_CPPDAP     = true
CMAKE_USE_SYSTEM_LIBRARY_CURL       = true
CMAKE_USE_SYSTEM_LIBRARY_EXPAT      = true
CMAKE_USE_SYSTEM_LIBRARY_FORM       = true
CMAKE_USE_SYSTEM_LIBRARY_JSONCPP    = true
CMAKE_USE_SYSTEM_LIBRARY_LIBARCHIVE = true
CMAKE_USE_SYSTEM_LIBRARY_LIBLZMA    = true
CMAKE_USE_SYSTEM_LIBRARY_LIBRHASH   = true
CMAKE_USE_SYSTEM_LIBRARY_LIBUV      = true
CMAKE_USE_SYSTEM_LIBRARY_NGHTTP2    = true
CMAKE_USE_SYSTEM_LIBRARY_ZLIB       = true
CMAKE_USE_SYSTEM_LIBRARY_ZSTD       = true

[on.msvc]
deps = [ "cppdap", "expat", "jsoncpp", "libuv", "nghttp2", "zlib" ]

[on.msvc.cmake.defs]
CMAKE_USE_SYSTEM_LIBRARY_BZIP2      = false
CMAKE_USE_SYSTEM_LIBRARY_CURL       = false
CMAKE_USE_SYSTEM_LIBRARY_FORM       = false
CMAKE_USE_SYSTEM_LIBRARY_LIBARCHIVE = false
CMAKE_USE_SYSTEM_LIBRARY_LIBLZMA    = false
CMAKE_USE_SYSTEM_LIBRARY_LIBRHASH   = false
CMAKE_USE_SYSTEM_LIBRARY_ZSTD       = false

[on."!msvc"]
deps = [
  "bzip2",
  "cppdap",
  "curl",
  "expat",
  "jsoncpp",
  "libarchive",
  "libuv",
  "ncurses",
  "nghttp2",
  "rhash",
  "xz",
  "zlib",
  "zstd",
]
