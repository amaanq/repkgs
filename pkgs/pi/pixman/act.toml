track = "generic:pixman?url=https://cairographics.org/releases/"
fetch = { url = "https://cairographics.org/releases/pixman-{version}.tar.gz" }
with  = [ "meson" ]
deps  = [ "libpng" ]

[test]
separate = true

[meson.defs]
a64-neon     = "disabled"
arm-simd     = "disabled"
demos        = "disabled"
gtk          = "disabled"
libpng       = "enabled"
loongson-mmi = "disabled"
mips-dspr2   = "disabled"
mmx          = "disabled"
neon         = "disabled"
openmp       = "disabled"
rvv          = "disabled"
sse2         = "disabled"
ssse3        = "disabled"
tests        = "enabled"
vmx          = "disabled"

[on.aarch64.meson.defs]
a64-neon = "enabled"

[on.powerpc64le.meson.defs]
vmx = "enabled"

[on.riscv64.meson.defs]
rvv = "enabled"

[on.x86_64.meson.defs]
mmx   = "enabled"
sse2  = "enabled"
ssse3 = "enabled"
