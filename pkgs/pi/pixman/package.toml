[upstream]
purl = "pkg:generic/pixman?url=https://cairographics.org/releases/"

[[source]]
key  = "default"
url  = "https://cairographics.org/releases/pixman-{version}.tar.gz"
hash = "sha256-SiXzRtCuAkbg4LBFc3USTRwj9qsAtLyfzaDMed8h7Cc="

[pin]
version = "0.46.4"

[package]
uses         = [ "meson" ]
dependencies = [ "libpng" ]

[package.meson]
skipTests = [ "stress-test", "tolerance-test", "composite" ]

[package.meson.defs]
libpng = "enabled"
tests  = "enabled"

[package.tests]
separate = true
