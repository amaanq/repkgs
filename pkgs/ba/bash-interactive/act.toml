fetch = { from = "bash" }
with = [ "autotools" ]
patches = [
  "../bash/relocatable.patch",
  "../bash/fail-tests.patch",
  "../bash/tests-select.patch",
  "../bash/printf-precision-overflow.patch",
  "../bash/trap-order.patch",
]
deps = [ "readline", "ncurses" ]

[test]
bin      = [ "bash" ]
separate = true

[only]
posix = true

[autotools]
testScripts = { files = "tests/run-*", variable = "BASH_TEST_SCRIPTS" }
flags = [
  "--without-bash-malloc",
  "--with-installed-readline",
  "bash_cv_func_strtoimax=y",
  "bash_cv_getcwd_malloc=yes",
  "bash_cv_job_control_missing=nomissing",
  "bash_cv_sys_named_pipes=nomissing",
]
