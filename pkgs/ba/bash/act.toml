track = "gnu:bash"
fetch = { url = "https://ftp.gnu.org/gnu/bash/bash-{version}.tar.gz" }
with = [ "autotools" ]
bootstrapTools = true
patches = [
  "relocatable.patch",
  "fail-tests.patch",
  "tests-select.patch",
  "printf-precision-overflow.patch",
]

[test]
bin      = [ "bash", "sh" ]
separate = true

[only]
posix = true

[autotools]
testScripts = { files = "tests/run-*", variable = "BASH_TEST_SCRIPTS" }
flags = [
  "--without-bash-malloc",
  "--disable-readline",
  "bash_cv_func_strtoimax=y",
  "bash_cv_getcwd_malloc=yes",
  "bash_cv_job_control_missing=nomissing",
  "bash_cv_sys_named_pipes=nomissing",
]

[links]
"bin/sh" = "bash"
