[upstream]
purl = "pkg:gnu/bash"

[[source]]
key  = "default"
url  = "https://ftp.gnu.org/gnu/bash/bash-{version}.tar.gz"
hash = "sha256-yDRoQcHzXgMUcaxNq9WMezU6zwzZp4Z4T2oD2qyfHK4="

[pin]
version = "5.3"

[package]
patches        = [ "relocatable.patch" ]
uses           = [ "autotools" ]
bin            = [ "bash", "sh" ]
bootstrapTools = true

[package.platforms]
posix = true

[package.autotools]
flags = [
  "--without-bash-malloc",
  "--disable-readline",
  "bash_cv_func_strtoimax=y",
  "bash_cv_getcwd_malloc=yes",
  "bash_cv_job_control_missing=nomissing",
  "bash_cv_sys_named_pipes=nomissing",
]

[package.tests]
run = false

[package.links]
"bin/sh" = "bash"
