fetch = { from = "llvm22" }
with  = [ "cmake" ]
deps  = [ "llvm22", "zlib", "zstd" ]
tools = [ "cpython", "llvm22" ]

[steps.replace]
"cmake.test" = [ "llvm22.test" ]

[cmake]
root = "clang"

[cmake.defs]
BUILD_SHARED_LIBS                     = false
CLANG_BUILD_EXAMPLES                  = false
CLANG_ENABLE_ARCMT                    = false
CLANG_ENABLE_STATIC_ANALYZER          = false
CLANG_INCLUDE_DOCS                    = false
CLANG_INCLUDE_TESTS                   = true
CLANG_LINK_CLANG_DYLIB                = true
CLANG_TOOLING_BUILD_AST_INTROSPECTION = false
LIBCLANG_BUILD_STATIC                 = false
LLVM_INCLUDE_TESTS                    = true
LLVM_LINK_LLVM_DYLIB                  = true
LLVM_DIR                              = "{pkg:llvm22}/lib/cmake/llvm"
LLVM_TABLEGEN_EXE                     = "{tool:llvm22}/bin/llvm-tblgen"
LLVM_TOOLS_BINARY_DIR                 = "{tool:llvm22}/bin"

[install]
"bin/" = "bin/clang-tblgen{platform:ext.exe}"

[on.cross]
tools = [ "clang22" ]

[on.cross.cmake.defs]
CLANG_TABLEGEN = "{tool:clang22}/bin/clang-tblgen"
