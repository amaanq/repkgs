fetch = { from = "llvm" }
with  = [ "cmake" ]
deps  = [ "llvm", "zlib", "zstd" ]
tools = [ "cpython", "llvm" ]

[test]
bin = [  ]
run = false

[steps]
skip = [ "cmake.test" ]

[cmake]
root = "clang"

[cmake.defs]
BUILD_SHARED_LIBS                     = false
CLANG_BUILD_EXAMPLES                  = false
CLANG_BUILD_TOOLS                     = false
CLANG_ENABLE_ARCMT                    = false
CLANG_ENABLE_STATIC_ANALYZER          = false
CLANG_INCLUDE_DOCS                    = false
CLANG_INCLUDE_TESTS                   = false
CLANG_LINK_CLANG_DYLIB                = true
CLANG_TOOLING_BUILD_AST_INTROSPECTION = false
LIBCLANG_BUILD_STATIC                 = false
LLVM_INCLUDE_TESTS                    = false
LLVM_LINK_LLVM_DYLIB                  = true
LLVM_DIR                              = "{pkg:llvm}/lib/cmake/llvm"
LLVM_TABLEGEN_EXE                     = "{tool:llvm}/bin/llvm-tblgen"
LLVM_TOOLS_BINARY_DIR                 = "{tool:llvm}/bin"

[bindings.cargo]
names = [ "clang-sys" ]
env   = { LIBCLANG_PATH = "{root}/lib" }

[install]
"bin/" = "bin/clang-tblgen{platform:ext.exe}"

[on.cross]
tools = [ "clang" ]

[on.cross.cmake.defs]
CLANG_TABLEGEN = "{tool:clang}/bin/clang-tblgen"
