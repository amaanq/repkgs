[upstream]
purl = "pkg:github/OpenMathLib/OpenBLAS"

[[source]]
key  = "default"
url  = "https://github.com/OpenMathLib/OpenBLAS/releases/download/{tag}/OpenBLAS-{version}.tar.gz"
hash = "sha256-usCAvjNUua91vBd1aXjsTyx8YrpuAkKGOpiQ58fT8Hc="

[pin]
version = "0.3.34"
date    = "2026-07-16"
tag     = "v0.3.34"

[package]
patches = [ "upstream-power-integrated-as.patch" ]
uses    = [ "make" ]

[package.platforms]
os = [ "linux" ]

[package.make]
buildTarget = [ "shared" ]
flags       = [ "DYNAMIC_ARCH=1" ]
testTarget  = [ "tests" ]

[when.native.make]
flags = [
  "TARGET=HASWELL",
  "HOSTCC=$(CC_FOR_BUILD)",
  "CROSS=0",
  "FC={pkg:flang-rt}/bin/flang",
  "NUM_THREADS=64",
  "USE_OPENMP=0",
]

[when.cpu.aarch64.make]
flags = [
  "TARGET=ARMV8",
  "HOSTCC=$(CC_FOR_BUILD)",
  "CROSS=1",
  "FC={pkg:flang-rt}/bin/flang",
  "NUM_THREADS=64",
  "USE_OPENMP=0",
]

[when.cpu.loongarch64.make]
flags = [
  "TARGET=LOONGSONGENERIC",
  "HOSTCC=$(CC_FOR_BUILD)",
  "CROSS=1",
  "FC={pkg:flang-rt}/bin/flang",
  "NUM_THREADS=64",
  "USE_OPENMP=0",
]

[when.cpu.powerpc64le.make]
flags = [
  "TARGET=POWER9",
  "HOSTCC=$(CC_FOR_BUILD)",
  "CROSS=1",
  "FC={pkg:flang-rt}/bin/flang",
  "NUM_THREADS=64",
  "USE_OPENMP=0",
]

[when.cpu.riscv64.make]
flags = [
  "TARGET=RISCV64_GENERIC",
  "HOSTCC=$(CC_FOR_BUILD)",
  "CROSS=1",
  "FC={pkg:flang-rt}/bin/flang",
  "NUM_THREADS=64",
  "USE_OPENMP=0",
]
