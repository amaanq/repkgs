tag     = "v{version}"
track   = "github:OpenMathLib/OpenBLAS"
fetch   = { asset = "OpenBLAS-{version}.tar.gz" }
with    = [ "make" ]
patches = [ "upstream-power-integrated-as.patch" ]

[only]
os = [ "linux" ]

[make]
buildTarget = [ "shared" ]
flags       = [ "DYNAMIC_ARCH=1" ]
testTarget  = [ "tests" ]
