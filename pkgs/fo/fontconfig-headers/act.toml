# only <fontconfig/*.h>: the JDK dlopens libfontconfig at run time
fetch = { url = "https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/{version}/fontconfig-{version}.tar.xz" }

[track]
from = "gitlab:fontconfig/fontconfig?repository_url=https://gitlab.freedesktop.org"

[track.watch] # tags before 2.3 are dates and font versions
url   = "https://www.freedesktop.org/software/fontconfig/release/"
regex = 'fontconfig-([0-9.]+)\.tar\.xz'

[steps]
phases = [ "fontconfig-headers.header" ]

[install]
"include/fontconfig/" = "fontconfig/{fontconfig,fcfreetype,fcprivate}.h"
