[upstream]
purl = "pkg:github/Mic92/formatelf"

[[source]]
key  = "default"
url  = "https://github.com/Mic92/formatelf/archive/refs/tags/{tag}.tar.gz"
hash = "sha256-xGXYZmvFBTZiUxtBKKbyqPI8reliajVHOgKT+U9ru0Y="

[pin]
version = "0.2.1"
tag     = "v0.2.1"
date    = "2026-09-09"

[package]
uses = [ "cargo" ]
bin  = [ "formatelf", "auto-formatelf" ]

[package.links]
"bin/auto-formatelf" = "formatelf"
"bin/patchelf"       = "formatelf"

[when.native.cargo]
tool = "{tool:rust-bootstrap}"

[when.os.linux.cargo]
tool = "{tool:rust-bootstrap}"
