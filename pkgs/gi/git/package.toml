[upstream]
purl = "pkg:github/git/git"

[[source]]
key  = "default"
url  = "https://www.kernel.org/pub/software/scm/git/git-{version}.tar.xz"
hash = "sha256-aTL1jVJ8xz4CMocAzzHaEepLgUO/7OXTb/Ao0GR5AVQ="

[pin]
version = "2.55.0"
tag     = "v2.55.0"

[package]
patches      = [ "relocatable.patch" ]
uses         = [ "autotools", "cargo" ]
dependencies = [ "zlib", "curl", "expat", "pcre2", "openssl" ]

[package.platforms]
posix = true

[package.autotools]
flags = [ "--with-curl", "--with-expat", "--with-libpcre2", "--without-tcltk" ]
makeFlags = [
  "RUNTIME_PREFIX=YesPlease",
  "gitexecdir=libexec/git-core",
  "template_dir=share/git-core/templates",
  "sysconfdir=/etc",
  "RUST_TARGET_DIR=$(CARGO_TARGET_DIR)/{platform.rustTriple}/release",
  "CURL_LDFLAGS=-lcurl",
  "NO_PERL=1",
  "PERL_PATH=",
  "NO_PYTHON=1",
  "NO_GETTEXT=1",
  "uname_S={platform.osNames.cmake}",
  "uname_M={platform.cpu}",
  "uname_O={var:unameO}",
  "uname_R=",
  "NO_INSTALL_HARDLINKS=1",
  "INSTALL_SYMLINKS=1",
]
outOfTree = false
testTarget = [ "-C", "t", "T=t0000-basic.sh" ]

[package.cargo]
deps = "{null}"
tool = "{tool:rust-bootstrap}"

[package.phases]

[vars]
unameO = "GNU/Linux"

[when.os.windows.vars]
unameO = "windows"

[when.os.macos.vars]
unameO = "macos"
