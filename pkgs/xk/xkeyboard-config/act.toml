track   = 'generic:xkeyboard-config?url=https://xorg.freedesktop.org/archive/individual/data/xkeyboard-config/&regex=xkeyboard-config-([0-9.]+)\.tar\.xz'
fetch   = { url = "https://xorg.freedesktop.org/archive/individual/data/xkeyboard-config/xkeyboard-config-{version}.tar.xz" }
with    = [ "meson" ]
patches = [ "pytest-module.patch" ]
tools   = [ "gettext", "libxslt", "perl", "xkbcomp", "cpython314", "python-pytest", "python-pytest-xdist", "python-pycountry" ]

[test]
bin     = [  ]
version = false

[steps.before]
"meson.configure" = [ "xkeyboard-config.shebangs" ]

[meson.defs]
nls = true
