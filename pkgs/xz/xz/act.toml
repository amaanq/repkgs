tag     = "v{version}"
track   = "github:tukaani-project/xz"
fetch   = { asset = "xz-{version}.tar.xz" }
with    = [ "cmake" ]
patches = [ "upstream-msvc-abi.patch" ]

[only]
abi = [ "gnu", "apple" ]

[cmake]
flags = [ "-DBUILD_SHARED_LIBS=ON", "-DXZ_NLS=OFF", "-DXZ_DOC=OFF", "-DXZ_POSIX_SHELL=/bin/sh" ]
tool  = "cmake-bootstrap"
