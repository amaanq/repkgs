track   = "gnu:ncurses"
fetch   = { url = "https://ftpmirror.gnu.org/ncurses/ncurses-{version}.tar.gz" }
with    = [ "autotools" ]
patches = [ "relocatable.patch", "cached-default-source.patch" ]

# make check prints "no unit-test implemented", and test/ holds interactive demos
[test]
bin     = [ "tic", "tput", "infocmp" ]
run     = false
version = "-V"

[steps.after]
"autotools.install" = [ "ncurses.narrow-names" ]

[steps.before]
"autotools.configure" = [ "ncurses.configure-env" ]

[autotools]
flags = [
  "--with-shared",
  "--without-debug",
  "--without-ada",
  "--enable-widec",
  "--with-versioned-syms",
  "--enable-pc-files",
  "--disable-stripping",
  "--with-terminfo-dirs=/etc/terminfo:/lib/terminfo:/usr/share/terminfo",
  "--with-manpage-format=normal",
]

[on.cross]
tools = [ "ncurses" ]

[on.cross.autotools]
flags = [
  "--with-tic-path={tool:ncurses}/bin/tic",
  "--with-infocmp-path={tool:ncurses}/bin/infocmp",
]

[on.windows.autotools]
flags = [ "--enable-term-driver", "--enable-sp-funcs" ]

[on."!windows".autotools]
flags = [ "--with-termlib" ]

[bindings]
gems = [ "curses" ]
hackage = [
  "LibClang",
  "fearOfView",
  "hetris",
  "hmp3",
  "hmp3-ng",
  "hscurses",
  "htalkat",
  "mage",
  "nanocurses",
  "ncurses",
  "riot",
  "terminfo",
  "vimus",
]
