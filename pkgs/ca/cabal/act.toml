tag     = "cabal-install-v{version}"
fetch   = { archive = true }
with    = [ "cabal" ]
patches = [ "system-zlib.patch" ]

[track]
from = "github:haskell/cabal"

[track.locks]
hackage = "."

[test]
deps    = [ "git" ]
version = "--numeric-version"

[steps.before]
"cabal.test" = [ "hackage.index" ]

[cabal]
exes        = [ "cabal" ]
tool        = "cabal-bootstrap"
projectFile = "cabal.release.project"

[cabal.testOptions]
"cabal-install:test:integration-tests2" = [
  [
    "--num-threads",
    "1",
    "--with-ghc={tool:ghc-bootstrap}/bin/ghc",
  ],
]
"cabal-install:test:mem-use-tests" = [ [ "--num-threads", "1" ] ]
"cabal-install:test:unit-tests" = [ [ "--num-threads", "1" ] ]
"Cabal-tests:test:unit-tests" = [ [ "--with-ghc={tool:ghc-bootstrap}/bin/ghc" ] ]
"Cabal-tests:test:hackage-tests" = [ [ "read-fields" ], [ "parsec" ], [ "roundtrip" ] ]
