track = 'generic:lua?url=https://www.lua.org/ftp/&regex=lua-(5\.4\.\d+)\.tar\.gz'
fetch = { url = "https://www.lua.org/ftp/lua-{version}.tar.gz" }
with  = [  ]

[test]
bin     = [ "lua", "luac" ]
version = "-v"

[steps]
phases = [  ]

[install]

[make]

[on.linux]
deps = [ "ncurses", "readline" ]

[on.linux.make]
buildTarget = [ "linux-readline" ]
flags = [
  "LUA_SO=liblua.so",
  "TO_LIB=liblua.a liblua.so liblua.so.5.4",
  "INSTALL_DATA=cp -d",
  "MYLIBS=-lncurses",
]

[on.linux.steps.after]
"make.install" = [ "lua.pc" ]

[on.macos.make]
buildTarget = [ "macosx" ]

[on.macos.steps.after]
"make.install" = [ "lua.pc" ]

[on.mingw.install]
"bin/" = [ "src/lua54.dll" ]

[on.mingw.make]
buildTarget = [ "mingw" ]

[on.msvc.install]
"bin/"          = [ "src/lua.exe", "src/luac.exe", "src/lua54.dll" ]
"include/"      = [ "src/lua.h", "src/luaconf.h", "src/lualib.h", "src/lauxlib.h", "src/lua.hpp" ]
"lib/lua54.lib" = "src/lua54.lib"

[on.msvc.steps]
phases = [ "lua.msvc" ]

[on."!msvc"]
with = [ "make" ]

[on."!msvc".make]
flags      = [ "MYCFLAGS=-fPIC", "INSTALL_TOP=$(prefix)" ]
programs   = [ "lua", "luac" ]
testTarget = [ "test" ]
