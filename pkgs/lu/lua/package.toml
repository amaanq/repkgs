[upstream]
purl = 'pkg:generic/lua?url=https://www.lua.org/ftp/&regex=lua-(5\.4\.\d+)\.tar\.gz'

[[source]]
key  = "default"
url  = "https://www.lua.org/ftp/lua-{version}.tar.gz"
hash = "sha256-t2xzwJrMSWAAsBjP7AUkE/H8QgMkBYXqtns59RqPoxU="

[pin]
version = "5.4.9"

[package]
patches = [ "relocatable.patch" ]
uses    = [  ]
phases  = [  ]
bin     = [ "lua", "luac" ]

[package.make]

[package.tests]
version = "-v"

[package.install]

[when.libc.mingw.install]
"bin/" = [ "src/lua54.dll" ]

[when.libc.mingw.make]
buildTarget = [ "mingw" ]

[when.libc.msvc]
phases = [ "lua.msvc" ]

[when.libc.msvc.install]
"bin/"          = [ "src/lua.exe", "src/luac.exe", "src/lua54.dll" ]
"include/"      = [ "src/lua.h", "src/luaconf.h", "src/lualib.h", "src/lauxlib.h", "src/lua.hpp" ]
"lib/lua54.lib" = "src/lua54.lib"

[when.os.linux.make]
buildTarget = [ "linux" ]

[when.os.macos.make]
buildTarget = [ "macosx" ]

[unless.libc.msvc]
uses = [ "make" ]

[unless.libc.msvc.make]
flags      = [ "MYCFLAGS=-fPIC", "INSTALL_TOP=$(prefix)" ]
programs   = [ "lua", "luac" ]
testTarget = [ "test" ]
