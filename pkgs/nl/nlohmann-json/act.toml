tag  = "v{version}"
with = [ "cmake" ]

[fetch.default]
archive = true

[fetch.testdata]
url = "https://github.com/nlohmann/json_test_data/archive/refs/tags/v{testdata}.tar.gz"

[track]
from = "github:nlohmann/json"

[cmake]
tool = "cmake-bootstrap"

[cmake.defs]
JSON_MultipleHeaders   = true
JSON_TestDataDirectory = "{source:testdata}"

[test]
deps     = [ "git" ]
separate = true

[steps.before]
"cmake.test" = [ "nlohmann-json.test" ]
