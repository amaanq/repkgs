tag   = "v{version}"
track = "github:atuinsh/atuin"
fetch = { archive = true }
with  = [ "cargo" ]
deps  = [ "openssl" ]
tools = [ "bash-interactive", "git", "postgresql", "tzdata" ]

[steps.before]
"cargo.test" = [ "atuin.start-postgres" ]

[steps.after]
"cargo.test" = [ "atuin.stop-postgres" ]

[cargo]
noDefaultFeatures = true
features          = [ "ai", "client", "clipboard", "daemon", "pty-proxy", "sync" ]
