track   = "generic:attr?url=https://download.savannah.nongnu.org/releases/attr/"
fetch   = { url = "https://download.savannah.nongnu.org/releases/attr/attr-{version}.tar.gz" }
with    = [ "autotools" ]
patches = [ "relocatable.patch" ]

# the nix sandbox answers every xattr syscall with ENOTSUP
[test]
bin = [ "getfattr", "setfattr", "attr" ]
run = false

[only]
os = [ "linux" ]
