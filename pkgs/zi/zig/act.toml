track = "generic:zig?url=https://ziglang.org/download/index.json"
fetch = { url = "https://ziglang.org/download/{version}/zig-{version}.tar.xz" }
with = [ "cmake" ]
deps = [ "llvm22", "clang22", "lld22", "zlib", "zstd" ]
prebuilt = true
patches = [
  "cmake-zig-executable.patch",
  "ld-script-relative-members.patch",
  "native-interp-without-env.patch",
  "cache-input-digest.patch",
]

[test]
run     = false
version = "version"

[steps.after]
"cmake.build"     = "zig.store"
"cmake.configure" = "zig.restore"

[cmake.defs]
CMAKE_BUILD_TYPE     = "RelWithDebInfo"
ZIG_EXTRA_BUILD_ARGS = "--build-id=sha1"
ZIG_PIE              = true
ZIG_SHARED_LLVM      = true
ZIG_TARGET_MCPU      = "baseline"

[env]
ZIG_GLOBAL_CACHE_DIR = "/build/zig-cache"
ZIG_LOCAL_CACHE_DIR  = "/build/zig-cache/local"

[on.cross.cmake.defs]
CMAKE_PROGRAM_PATH  = "{pkg:llvm22}/host"
ZIG_EXECUTABLE      = "{tool:zig}/bin/zig"
ZIG_STATIC_ZLIB     = true
ZIG_STATIC_ZSTD     = true
ZIG_USE_LLVM_CONFIG = true

[on.macos.cmake.defs]
ZIG_TARGET_TRIPLE = "aarch64-linux-gnu.2.44"

[on.windows.cmake.defs]
ZIG_TARGET_TRIPLE = "x86_64-linux-gnu.2.44"

[on.aarch64.cmake.defs]
ZIG_TARGET_TRIPLE = "aarch64-linux-gnu.2.44"

[on.loongarch64.cmake.defs]
ZIG_TARGET_TRIPLE = "loongarch64-linux-gnu.2.44"

[on.powerpc64le.cmake.defs]
ZIG_TARGET_TRIPLE = "powerpc64le-linux-gnu.2.44"

[on.riscv64.cmake.defs]
ZIG_TARGET_TRIPLE = "riscv64-linux-gnu.2.44"
