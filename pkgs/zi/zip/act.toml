fetch = { url = "https://downloads.sourceforge.net/infozip/zip30.tar.gz" }
patches = [
  "01-zipnote-freeze.patch",
  "02-cve-2018-13410.patch",
  "03-fix-command-injection.patch",
  "https://sources.debian.org/data/main/z/zip/3.0-16/debian/patches/hardening-build-fix-1.patch",
]

[track]
frozen = "Info-ZIP, last release 2009"

[test]
version = "-v"

[steps]
phases = [ "zip.build" ]

[only]
posix = true

[install]
"bin/zip" = "zip"
