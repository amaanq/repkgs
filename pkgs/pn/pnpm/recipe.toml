[upstream]
purl  = "pkg:npm/pnpm"
allow = "==11.*"

[[source]]
key  = "default"
url  = "https://registry.npmjs.org/pnpm/-/pnpm-{version}.tgz"
hash = "sha256-ozYOdiSkiznawo8tWvBz4EWvGaIwsPYIbHoLoMv0Euc="

[pin]
version = "11.27.0"
date    = "2026-09-12"

[build]
needs = [ "nodejs" ]

[build.install]
"lib/node_modules/pnpm" = "."

[build.links]
"bin/pnpm" = "../lib/node_modules/pnpm/bin/pnpm.cjs"
"bin/pnpx" = "../lib/node_modules/pnpm/bin/pnpx.cjs"
