tag   = "v{version}"
fetch = { archive = true }
with  = [ "go" ]

[track]
from = "github:FiloSottile/age"

[track.locks]
go = "."

[go]
packages = [ "./cmd/age", "./cmd/age-keygen" ]
ldflags  = [ "-X main.Version={version}" ]

[go.modulePatches]
"github.com/rogpeppe/go-internal" = [ "{file:testscript-drain-pty.patch}" ]
