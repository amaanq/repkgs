[upstream]
purl = "pkg:github/jqlang/jq"

[[source]]
key  = "default"
url  = "https://github.com/jqlang/jq/releases/download/{tag}/jq-{version}.tar.gz"
hash = "sha256-kDHkfxuvnfWZIeZ7K/H1Y0EdhcHhcPrIWa5ltIthQKk="

[pin]
version = "1.8.2"
tag     = "jq-1.8.2"

[build]
needs   = [ "oniguruma" ]
systems = [ "autotools" ]

[build.autotools]
flags      = [ "--with-oniguruma=yes", "--disable-docs", "--disable-maintainer-mode" ]
testTarget = [ "check", "TESTS=tests/jqtest" ]

[build.check]
separate = true
