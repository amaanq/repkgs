tag     = "v{version}"
track   = "github:alsa-project/alsa-lib"
fetch   = { url = "https://www.alsa-project.org/files/pub/lib/alsa-lib-{version}.tar.bz2" }
with    = [ "autotools" ]
patches = [ "relocatable.patch" ]

[only]
os = [ "linux" ]

[autotools]
flags = [ "--with-plugindir=/usr/lib/alsa-lib", "--disable-python", "--disable-topology" ]
