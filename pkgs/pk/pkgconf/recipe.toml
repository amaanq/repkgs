[upstream]
purl = "pkg:github/pkgconf/pkgconf"

[[source]]
key  = "default"
url  = "https://distfiles.ariadne.space/pkgconf/pkgconf-{version}.tar.xz"
hash = "sha256-P2JEYZxxg1nNRbutaidHiSar1l0fScsoToA5pwIIzDI="

[pin]
version = "2.5.1"

[build]
bin            = [ "pkgconf", "pkg-config" ]
bootstrapTools = true
check          = false
systems        = [ "autotools" ]

[build.autotools]
flags = [
  "--with-pkg-config-dir=",
  "--with-personality-dir=",
  "--with-system-libdir=/nonexistent",
  "--with-system-includedir=/nonexistent",
]

[build.links]
"bin/pkg-config" = "pkgconf"
