[upstream]
purl = "pkg:github/sqlite/sqlite"

[[source]]
key  = "default"
url  = "https://github.com/sqlite/sqlite/archive/refs/tags/version-{version}.tar.gz"
hash = "sha256-tjmZGDf3uMchitP3qdINME1q2FJDfNPQoKg9LeLSxg8="

[pin]
version = "3.53.4"
tag     = "version-3.53.4"

[package]
uses         = [ "make" ]
dependencies = [ "zlib" ]

[package.make]
configureFlags = [ "--enable-all", "--enable-column-metadata" ]

[package.tests]
run = false

[when.cross.make]
configureFlags = [ "--host={platform.gnuTriple}" ]

[when.os.linux.make]
flags = [ "LDFLAGS.libsqlite3.soname=-Wl,-soname,libsqlite3.so.0" ]
