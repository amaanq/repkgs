tag   = "nasm-{version}"
track = "github:netwide-assembler/nasm"
fetch = { url = "https://www.nasm.us/pub/nasm/releasebuilds/{version}/nasm-{version}.tar.xz" }
with  = [ "autotools" ]
tools = [ "perl" ]
test  = false

# Makefile.in names win/manifest.rc relative to the build directory, which has no win/
patches = [ "https://github.com/netwide-assembler/nasm/commit/8890d723d0aa9ed1a790e2ce1c55eee8dfa0cf94.patch" ]
[on.windows.autotools]
outOfTree = false
