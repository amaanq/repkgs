[upstream]
purl = "pkg:github/navidrome/navidrome"

[[source]]
key  = "default"
url  = "https://github.com/navidrome/navidrome/archive/refs/tags/{tag}.tar.gz"
hash = "sha256-2GUAGuwVE3i49g/mGN3zd1J1y9jVhF0g4hKGceSQwD8="

[pin]
version = "0.64.0"
date    = "2026-09-12"
tag     = "v0.64.0"
sys     = [ "sqlite", "taglib" ]

[locks]
go = "."

[package]
uses = [ "go", "npm" ]
# go's tests want a music library fixture set
phases = [ "npm.build", "go.build", "go.install" ]

[package.npm]
root = "ui"
deps = { fetch = "npmDeps", root = "ui", source = "{source:default}" }

[package.go]
tags = [ "netgo", "sqlite_fts5" ]
ldflags = [
  "-X github.com/navidrome/navidrome/consts.gitTag=v{pin.version}",
  "-X github.com/navidrome/navidrome/consts.gitSha=nix",
]
packages = [ "." ]
