[upstream]
purl = "pkg:gnu/readline"

[[source]]
key  = "default"
url  = "https://ftpmirror.gnu.org/readline/readline-{version}.tar.gz"
hash = "sha256-PhQxBHY8g6OaC7w2vHyGYVJVy7BtF6RjvH1EAF/Hza0="

[pin]
version = "8.3"
date    = "2025-07-03"

[package]
patches = [
  "mingw-0001-sigwinch.patch",
  "mingw-0002-event-hook.patch",
  "mingw-0003-no-winsize.patch",
  "mingw-0004-locale.patch",
]
uses = [ "autotools" ]
dependencies = [ "ncurses" ]

[package.autotools]
flags = [ "--with-curses", "--with-shared-termcap-library" ]

[when.os.windows.autotools]
flags     = [ "CFLAGS=-D__USE_MINGW_ALARM -D_POSIX" ]
makeFlags = [ "SHOBJ_LDFLAGS=-shared -Wl,--export-all-symbols -Wl,--enable-auto-import" ]
