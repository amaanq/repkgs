fetch   = { url = "https://download.gnome.org/sources/glib/{major}.{minor}/glib-{version}.tar.xz" }
with    = [ "meson" ]
deps    = [ "pcre2", "libffi", "zlib", "cpython" ]
patches = [ "relocatable.patch" ]

[track]
from = "generic:glib"

[track.watch]
url   = "https://download.gnome.org/sources/glib/cache.json"
regex = 'glib-([0-9]+\.[0-9]*[02468]\.[0-9]+)\.tar'

[test]
bin = [ "glib-compile-resources", "gdbus" ]
run = false

[meson.defs]
documentation = false
dtrace        = "disabled"
introspection = "disabled"
libmount      = "disabled"
localstatedir = "/var"
man-pages     = "disabled"
nls           = "disabled"
selinux       = "disabled"
sysprof       = "disabled"
systemtap     = "disabled"
tests         = false
wrap_mode     = "nodownload"

[bindings]
cargo = [ "gio-sys", "glib-sys", "gobject-sys" ]
python = [ "pygobject" ]
hackage = [
  "bindings-glib",
  "bindings-gobject",
  "gi-gio",
  "gi-glib",
  "gi-gmodule",
  "gi-gobject",
  "glib",
  "glib-stopgap",
  "haskell-gi-base",
]
