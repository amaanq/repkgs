tag     = "OTP-{version}"
track   = "github:erlang/otp"
fetch   = { url = "https://github.com/erlang/otp/releases/download/OTP-{version}/otp_src_{version}.tar.gz" }
with    = [ "autotools" ]
deps    = [ "ncurses", "openssl", "zlib" ]
tools   = [ "perl" ]
patches = [ "upstream-cstdlib.patch", "erl-dirname.patch" ]
exports = false

[test]
bin     = [ "erl", "erlc", "escript" ]
run     = false
version = "erl -noshell -eval {ok,V}=file:read_file(filename:join([code:root_dir(),\"releases\",erlang:system_info(otp_release),\"OTP_VERSION\"])),io:put_chars(V),halt()."

[only]
posix = true

[autotools]
outOfTree = false
