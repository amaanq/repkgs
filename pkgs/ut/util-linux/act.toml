track   = 'generic:util-linux?url=https://github.com/util-linux/util-linux/tags&regex=v([0-9.]+)\.tar\.gz'
fetch   = { url = "https://www.kernel.org/pub/linux/utils/util-linux/v{major}.{minor}/util-linux-{version}.tar.xz" }
with    = [ "meson" ]
deps    = [ "ncurses", "zlib", "readline", "sqlite", "libxcrypt", "libcap" ]
tools   = [ "bison", "flex", "gettext" ]
patches = [ "01-CVE-2026-78408.patch", "02-libmount-build-fix.patch", "relocatable.patch" ]

[only]
os = [ "linux" ]

[meson.defs]
auto_features = "auto"
build-python  = "disabled"
build-vipw    = "disabled"
cryptsetup    = "disabled"
libutil       = "enabled"
ncursesw      = "enabled"
nls           = "enabled"
readline      = "enabled"
sysconfdir    = "/etc"
zlib          = "enabled"
