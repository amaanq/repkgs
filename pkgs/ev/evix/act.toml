tag   = "v{version}"
track = "github:manic-systems/evix"
fetch = { archive = true }
with  = [ "cargo" ]
deps  = [ "nix" ]
tools = [ "capnproto" ]

[test]
deps = [ "git" ]

[steps.before]
"cargo.test" = [ "evix.test-store" ]

[cargo.cratePatches]
nix-bindings-sys = [ "{file:nix-bindings-sys-fromattrs.patch}" ]
