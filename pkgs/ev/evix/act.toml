tag   = "v{version}"
track = "github:manic-systems/evix"
fetch = { archive = true }
with  = [ "cargo" ]
deps  = [ "nix" ]
tools = [ "capnproto" ]

[steps.before]
"cargo.test" = [ "evix.test-store" ]

[on.linux]
tools = [ "wild" ]

[on.linux.cc]
linker = "wild"

[cargo.cratePatches]
nix-bindings-sys = [ "{file:nix-bindings-sys-fromattrs.patch}" ]
