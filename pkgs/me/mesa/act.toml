track = 'generic:mesa?url=https://archive.mesa3d.org/&regex=mesa-([0-9]+\.[0-9]+\.[0-9]+)\.tar\.xz'
fetch = { url = "https://archive.mesa3d.org/mesa-{version}.tar.xz" }
patches = [ "relocatable.patch" ]
with = [ "meson" ]
deps = [
  "elfutils",
  "expat",
  "libdisplay-info",
  "libdrm",
  "libx11",
  "libxcb",
  "libxdamage",
  "libxext",
  "libxfixes",
  "libxrandr",
  "libxshmfence",
  "libxxf86vm",
  "wayland",
  "wayland-protocols",
  "zlib",
  "zstd",
]
tools = [
  "bison",
  "cpython314",
  "flex",
  "glslang",
  "python-mako",
  "python-packaging",
  "python-pyyaml",
  "wayland",
]

[only]
os = [ "linux" ]

[test]
version = false

[meson.defs]
allow-kcmp              = "enabled"
amd-use-llvm            = false
android-libbacktrace    = "disabled"
android-libperfetto     = "disabled"
build-tests             = false
egl                     = "enabled"
expat                   = "enabled"
gallium-drivers         = "radeonsi,softpipe"
gallium-mediafoundation = "disabled"
gallium-va              = "disabled"
gbm                     = "enabled"
gles1                   = "disabled"
gles2                   = "enabled"
glvnd                   = "disabled"
intel-rt                = "disabled"
libunwind               = "disabled"
llvm                    = "disabled"
lmsensors               = "disabled"
microsoft-clc           = "disabled"
platforms               = "x11,wayland"
shader-cache            = "enabled"
shared-glapi            = "enabled"
spirv-tools             = "disabled"
valgrind                = "disabled"
vulkan-drivers          = "amd"
xmlconfig               = "enabled"
zstd                    = "enabled"
