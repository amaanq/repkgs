fetch   = { url = "https://github.com/openjdk/jdk25u/archive/refs/tags/jdk-{version}-ga.tar.gz" }
deps    = [ "zlib", "libpng", "freetype", "alsa-lib", "libffi", "cups-headers", "fontconfig-headers" ]
tools   = [ "jdk-bootstrap", "autoconf", "bash", "zip", "unzip" ]
exports = false
patches = [ "upstream-riscv-float-type.patch" ]

[track]
from = "github:openjdk/jdk25u"

[track.watch]
url   = "https://github.com/openjdk/jdk25u/tags"
regex = "jdk-(25[0-9.]*)-ga"                     # -ga tags only

[test]
bin = [ "java", "javac", "jar" ]

[steps]
phases = [ "jdk.configure", "jdk.build", "jdk.install" ]

[only]
cpu = [ "x86_64", "aarch64", "riscv64", "powerpc64le" ]

[on.cross]
tools = [ "jdk" ]
