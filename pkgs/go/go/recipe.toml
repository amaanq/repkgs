[upstream]
purl = 'pkg:generic/go?url=https://go.dev/dl/&regex=go(\d[0-9.]*)\.src\.tar\.gz'

[[source]]
key  = "default"
url  = "https://go.dev/dl/go{version}.src.tar.gz"
hash = "sha256-r3NLW/7vnou1yL39OYdcXXJhiuGU27HudDdZcDLEAtI="

[pin]
version = "1.27.1"

[build]
bin     = [ "go", "gofmt" ]
exports = false
phases  = [ "go.build" ]
source  = "default"
tools   = [ "go-bootstrap" ]

[build.check]
version = "version"
