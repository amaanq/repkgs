track = "generic:tzdb?url=https://data.iana.org/time-zones/releases/"
fetch = { url = "https://data.iana.org/time-zones/releases/tzdb-{version}.tar.lz" }
with  = [ "make" ]

# the man pages are rendered to text for the character set checks
[test]
deps = [ "mandoc", "util-linux" ]

[steps.before]
"make.test" = [ "tzdata.test" ]

[only]
os = [ "linux", "macos" ]

[make]
flags        = [ "cc=cc", "AR=llvm-ar", "RANLIB=llvm-ranlib", "USRDIR=", "ZICDIR=$(BINDIR)" ]
installFlags = [ "TOPDIR=$(PREFIX)" ]
programs     = [ "zic", "zdump" ]

[on.cross.make]
flags = [ "zic={tool:tzdata}/bin/zic" ]
