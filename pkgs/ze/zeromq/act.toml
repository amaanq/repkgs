tag = "v{version}"
track = "github:zeromq/libzmq"
fetch = { asset = "zeromq-{version}.tar.gz" }
with = [ "cmake" ]
deps = [ "libsodium" ]
patches = [
  "github:zeromq/libzmq/commit/2e8a6ccb414ca79636392604893c79c3b0d00dc4",
  "github:zeromq/libzmq/commit/aa885c5a154256612108636b0fb22f44ae0e247a",
  "algorithm-include.patch",
]

[cmake]
skipTests = [ "test_mock_pub_sub" ]

[cmake.defs]
CMAKE_POLICY_VERSION_MINIMUM = "3.5"
ENABLE_CURVE                 = true
WITH_LIBSODIUM               = true

# the select poller cannot carry IPC, which windows has over AF_UNIX, so use the bundled wepoll
[on.windows.cmake.defs]
POLLER = "epoll"

[bindings.python]
names = [ "pyzmq" ]
env   = { PYZMQ_NO_BUNDLE = "1" }
