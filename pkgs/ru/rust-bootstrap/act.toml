track    = "github:rust-lang/rust"
deps     = [ "zlib", "libgcc-shim" ]
exports  = false
prebuilt = "ldso"
source   = "rustc-riscv64"

[fetch.rustc-x86_64]
url = "https://static.rust-lang.org/dist/rustc-{version}-x86_64-unknown-linux-gnu.tar.xz"

[fetch.rustc-aarch64]
url = "https://static.rust-lang.org/dist/rustc-{version}-aarch64-unknown-linux-gnu.tar.xz"

[fetch.rustc-riscv64]
url = "https://static.rust-lang.org/dist/rustc-{version}-riscv64gc-unknown-linux-gnu.tar.xz"

[fetch.cargo-x86_64]
url = "https://static.rust-lang.org/dist/cargo-{version}-x86_64-unknown-linux-gnu.tar.xz"

[fetch.cargo-aarch64]
url = "https://static.rust-lang.org/dist/cargo-{version}-aarch64-unknown-linux-gnu.tar.xz"

[fetch.cargo-riscv64]
url = "https://static.rust-lang.org/dist/cargo-{version}-riscv64gc-unknown-linux-gnu.tar.xz"

[fetch.rust-std-x86_64]
url = "https://static.rust-lang.org/dist/rust-std-{version}-x86_64-unknown-linux-gnu.tar.xz"

[fetch.rust-std-aarch64]
url = "https://static.rust-lang.org/dist/rust-std-{version}-aarch64-unknown-linux-gnu.tar.xz"

[fetch.rust-std-riscv64]
url = "https://static.rust-lang.org/dist/rust-std-{version}-riscv64gc-unknown-linux-gnu.tar.xz"

[test]
bin     = [ "rustc", "cargo" ]
version = "-V"

[steps]
phases = [ "rust-bootstrap.install" ]
