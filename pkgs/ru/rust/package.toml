[upstream]
purl = "pkg:github/rust-lang/rust"

[[source]]
key  = "default"
url  = "https://static.rust-lang.org/dist/rustc-{version}-src.tar.xz"
hash = "sha256-lBWYklstPu8ltF3JEPmr+FbMRoD+ax8ji9oTSlYhamM="

[pin]
version = "1.98.1"
date    = "2026-09-03"
tag     = "1.98.1"
sys     = [ "curl", "jemalloc", "libffi", "libgit2", "openssl", "xz", "zlib" ]

[package]
phases       = [ "rust.configure", "rust.build", "rust.install" ]
dependencies = [ "llvm22" ]
bin          = [ "rustc", "cargo" ]
exports      = false

[package.tests]
run     = false
version = "-V"

[when.native]
buildDependencies = [ "rust-bootstrap", "cpython", "cmake", "ninja", "pkgconf" ]

[when.cross]
buildDependencies = [ "llvm22", "rust-bootstrap", "cpython", "cmake", "ninja", "pkgconf" ]
