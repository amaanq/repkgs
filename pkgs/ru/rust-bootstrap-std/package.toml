from = "rust-bootstrap"

[package]
source   = "rust-std-x86_64"
phases   = [ "rust-bootstrap-std.install" ]
exports  = false
prebuilt = "ldso"

[when.cpu.aarch64]
source = "rust-std-aarch64"

[when.cpu.loongarch64]
source = "rust-std-loongarch64"

[when.cpu.powerpc64le]
source = "rust-std-powerpc64le"

[when.cpu.riscv64]
source = "rust-std-riscv64"
