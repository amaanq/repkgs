fetch = { from = "llvm" }
with  = [ "cmake" ]
deps  = [ "llvm", "zlib", "zstd" ]
tools = [ "cpython", "llvm" ]

[test]
bin = [ "mlir-tblgen" ]

[steps.replace]
"cmake.test" = [ "llvm.test" ]

[only]
cross = false

[cmake]
root = "mlir"

[cmake.defs]
BUILD_SHARED_LIBS              = false
LLVM_INCLUDE_TESTS             = true
LLVM_LINK_LLVM_DYLIB           = true
MLIR_ENABLE_BINDINGS_PYTHON    = false
MLIR_INCLUDE_DOCS              = false
MLIR_INCLUDE_INTEGRATION_TESTS = false
MLIR_INCLUDE_TESTS             = true
MLIR_INSTALL_AGGREGATE_OBJECTS = false
MLIR_LINK_MLIR_DYLIB           = false
LLVM_DIR                       = "{pkg:llvm}/lib/cmake/llvm"
LLVM_EXTERNAL_LIT              = "{source:default}/llvm/utils/lit/lit.py"
LLVM_TABLEGEN_EXE              = "{tool:llvm}/bin/llvm-tblgen"
LLVM_TOOLS_BINARY_DIR          = "{tool:llvm}/bin"

[install]
"bin/" = "bin/mlir-tblgen"
