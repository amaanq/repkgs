[upstream]
purl = "pkg:github/facebook/zstd"

[[source]]
key  = "default"
url  = "https://github.com/facebook/zstd/archive/refs/tags/{tag}.tar.gz"
hash = "sha256-tNFWIT9ydfozB8dWcmTMuZLCQmQudTFJIkSr0aG7S44="

[pin]
version = "1.5.7"
tag     = "v1.5.7"

[build]
check   = false
needs   = [ "zlib", "xz", "lz4" ]
systems = [ "cmake" ]

[build.cmake]
root = "build/cmake"

[build.cmake.defs]
ZSTD_BUILD_CONTRIB  = false
ZSTD_BUILD_TESTS    = false
ZSTD_LEGACY_SUPPORT = false
