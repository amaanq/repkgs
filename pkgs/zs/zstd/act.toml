tag   = "v{version}"
track = "github:facebook/zstd"
fetch = { archive = true }
with  = [ "cmake" ]
deps  = [ "zlib", "xz", "lz4" ]

[cmake]
root = "build/cmake"
tool = "cmake-bootstrap"

[cmake.defs]
ZSTD_BUILD_CONTRIB  = false
ZSTD_LEGACY_SUPPORT = false

[bindings.cargo]
names = [ "zstd-sys" ]
env   = { ZSTD_SYS_USE_PKG_CONFIG = "1" }

[bindings.python]
configSettings.zstandard.--build-option = "--system-zstd"
