track = "github:open-source-parsers/jsoncpp"
fetch = { url = "https://github.com/open-source-parsers/jsoncpp/archive/refs/tags/{version}.tar.gz" }
with  = [ "cmake" ]
tools = [ "cpython" ]

[cmake]
tool = "cmake-bootstrap"

[cmake.defs]
BUILD_OBJECT_LIBS                = false
BUILD_STATIC_LIBS                = true
JSONCPP_WITH_POST_BUILD_UNITTEST = false

[on.msvc.cmake.defs]
BUILD_STATIC_LIBS = false
