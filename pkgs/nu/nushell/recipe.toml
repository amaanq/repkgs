[upstream]
purl = "pkg:github/nushell/nushell"

[[source]]
key  = "default"
url  = "https://github.com/nushell/nushell/archive/refs/tags/{tag}.tar.gz"
hash = "sha256-qndvtW1yD4n++LpGp+ucQVNqIm8jgcrM3M4O5q5WDgk="

[pin]
version = "0.115.1"
tag     = "0.115.1"
date    = "2026-08-23"
sys     = [ "curl", "clang", "libgit2", "lz4", "openssl", "sqlite", "zlib", "zstd" ]

[build]
bin     = [ "nu" ]
check   = false
systems = [ "cargo" ]

[build.cargo]
features          = [ "network", "sqlite", "trash-support", "rustls-tls" ]
noDefaultFeatures = true
