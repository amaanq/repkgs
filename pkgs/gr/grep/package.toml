[upstream]
purl = "pkg:gnu/grep"

[[source]]
key  = "default"
url  = "https://ftp.gnu.org/gnu/grep/grep-{version}.tar.xz"
hash = "sha256-9CQnJn6JSDzD1GR+4FLyTGfmejOh+QEKNsBN1Etypqk="

[pin]
version = "3.12"

[package]
uses           = [ "autotools" ]
bootstrapTools = true

[package.autotools]
flags     = [ "--disable-perl-regexp" ]
makeFlags = [ "SHELL=$(CONFIG_SHELL)" ]

[package.phases.after]
"autotools.install" = [ "grep.drop-wrappers" ]

[package.tests]
dependencies = [ "{tool:perl}" ]
separate     = true
