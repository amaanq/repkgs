track = "gnu:gawk"
fetch = { url = "https://ftp.gnu.org/gnu/gawk/gawk-{version}.tar.xz" }
with = [ "autotools" ]
bootstrapTools = true
patches = [
  "relocatable.patch",
  "https://cgit.git.savannah.gnu.org/cgit/gawk.git/patch/awk.h?id=bf85f8a3175af703597082d4c7e0abc2066a44d3",
  "uintmax-range.patch",
]

[test]
bin      = [ "gawk", "awk" ]
separate = true

[steps.before]
"autotools.test" = [ "gawk.locales" ]

[only]
posix = true

[autotools]
flags = [ "--disable-mpfr" ]
