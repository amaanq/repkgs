helpers = "python"

[upstream]
purl  = "pkg:github/python/cpython"
allow = "==3.14.*"

[[source]]
key  = "default"
url  = "https://www.python.org/ftp/python/{version}/Python-{version}.tar.xz"
hash = "sha256-lJP052bZrUsDASpKauL7Xa6pI3QMQW1Ho3o7Dsr062Y="

# PCbuild compiles its externals in from source (get_externals.bat's pins). bzip2, mpdecimal and
# zstd are our packages' sources; liblzma.vcxproj is written against xz 5.2's file list,
# sqlite3.vcxproj wants the amalgamation, and zlib-ng is not zlib
[[source]]
key  = "zlib-ng"
url  = "https://github.com/python/cpython-source-deps/archive/refs/tags/zlib-ng-{zlib_ng}.tar.gz"
hash = "sha256-eOw3CjdO5EHMofsgHRtH7fuydXZxrwpVzNvjmNeIQqQ="

[[source]]
key  = "xz"
url  = "https://github.com/python/cpython-source-deps/archive/refs/tags/xz-{xz}.tar.gz"
hash = "sha256-DbocrojDc5hEyJ6YAP7iLuGnURgMLIHUFU6gJOzQgRM="

[[source]]
key  = "sqlite"
url  = "https://github.com/python/cpython-source-deps/archive/refs/tags/sqlite-{sqlite}.tar.gz"
hash = "sha256-7S+QPa5C+lQrmNEQFyqO+yvF47voia2z4vTJ2rEIpIY="

[pin]
version = "3.14.7"
zlib_ng = "2.2.4"
xz      = "5.2.5"
sqlite  = "3.50.4.0"

[package]
patches           = [ "relocatable.patch", "upstream-darwin-cross-xopen.patch" ]
uses              = [  ]
buildDependencies = [  ]
dependencies      = [  ]
bin               = [  ]

[package.platforms]
libc = [ "glibc", "musl", "apple", "msvc" ]

[package.autotools]
flags = [
  "--disable-test-modules",
  "--without-ensurepip",
  "--with-openssl={pkg:openssl}",
  "--with-system-libmpdec",
  "ac_cv_file__dev_ptmx=yes",
  "ac_cv_file__dev_ptc=no",
  "ac_cv_path_LLVM_PROFDATA=llvm-profdata",
  "ac_cv_path_ac_pt_LLVM_PROFDATA=llvm-profdata",
  "ac_cv_path_LLVM_AR=llvm-ar",
  "ac_cv_path_ac_pt_LLVM_AR=llvm-ar",
]

[package.vcxproj]

[package.phases.after]
"autotools.install" = [  ]
"vcxproj.install"   = [  ]

[package.phases.before]
"vcxproj.configure" = [  ]

[package.tests]
run = false

[package.links]

[when.cross]
buildDependencies = [ "cpython" ]

[when.cross.autotools]
flags = [ "--with-build-python=python3", "ac_cv_buggy_getaddrinfo=no" ]

[when.libc.msvc]
bin  = [ "python" ]
uses = [ "vcxproj" ]

[when.libc.msvc.links]
"bin/python" = "python"

[when.libc.msvc.phases.after]
"vcxproj.install" = [ "cpython.windows-layout" ]

[when.libc.msvc.phases.before]
"vcxproj.configure" = [ "cpython.properties", "cpython.frozen-modules", "cpython.zlib-ng-headers" ]

[when.libc.msvc.vcxproj]
exclude  = [ "_freeze_module", "pylauncher", "pywlauncher", "pyshellext" ]
projects = [ "PCbuild/pcbuild.proj" ]

[when.libc.msvc.vcxproj.install]
Application    = "."
DynamicLibrary = "DLLs"

[when.libc.msvc.vcxproj.properties]
bz2Dir       = "{src:bzip2}/"
lzmaDir      = "{source:xz}/"
mpdecimalDir = "{src:mpdecimal}/"
sqlite3Dir   = "{source:sqlite}/"
zlibNgDir    = "{source:zlib-ng}/"
zstdDir      = "{src:zstd}/"

[unless.libc.msvc]
bin          = [ "python3" ]
dependencies = [ "zlib", "xz", "bzip2", "libffi", "openssl", "expat", "sqlite", "mpdecimal" ]
uses         = [ "autotools" ]

[unless.libc.msvc.phases.after]
"autotools.install" = [ "cpython.build-details" ]
