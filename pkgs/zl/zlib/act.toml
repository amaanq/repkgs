tag   = "v{version}"
track = "github:madler/zlib"
fetch = { asset = "zlib-{version}.tar.gz" }
with  = [ "cmake" ]

[test]
parallel = false

[cmake]
tool      = "cmake-bootstrap"
skipTests = [ "coverage" ]

[cmake.defs]
ZLIB_BUILD_EXAMPLES = false

[on.cross.cmake]
skipTests = [ "add_subdirectory", "find_package" ]

[bindings]
hackage = [
  "HsHTSLib",
  "adler32",
  "cabal-install-bundle",
  "digest",
  "iterIO",
  "keter-rate-limiting-plugin",
  "language-ocaml",
  "samtools",
  "sfnt2woff",
  "streaming-utils",
  "zlib",
  "zlib-core",
]

[bindings.cargo]
names = [ "libz-ng-sys", "libz-sys" ]
env   = { LIBZ_SYS_STATIC = "0", ZLIB_NO_VENDOR = "1" }

[bindings.gems]
flags.zlib = [ "--with-zlib-dir={root}" ]
