[upstream]
purl = "pkg:github/madler/zlib"

[[source]]
key  = "default"
url  = "https://github.com/madler/zlib/releases/download/{tag}/zlib-{version}.tar.gz"
hash = "sha256-tKLefmGqB2HVUMILJ7Gqa0v9GH7fqv64d5S5kK1tcYU="

[pin]
version = "1.3.2"
tag     = "v1.3.2"

[package]
uses = [ "cmake" ]

[package.cmake]
skipTests = [ "coverage" ]
tool      = "{tool:cmake-bootstrap}"

[package.cmake.defs]
ZLIB_BUILD_EXAMPLES = false

[package.tests]
parallel = false

[when.cross.cmake]
skipTests = [ "add_subdirectory", "find_package" ]
