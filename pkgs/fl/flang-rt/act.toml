fetch   = { from = "llvm" }
with    = [ "cmake" ]
tools   = [ "cpython" ]
patches = [ "../../ll/llvm/lit-test-marks.patch" ]

[test]
bin = [ "gfortran" ]

[steps.replace]
"cmake.test" = [ "llvm.test" ]

[steps.after]
"cmake.install" = [ "flang-rt.driver", "flang-rt.hello" ]

[only]
os = [ "linux" ]

[cmake]
root = "runtimes"

[cmake.defs]
BUILD_SHARED_LIBS            = false
CMAKE_Fortran_COMPILER_WORKS = true
FLANG_RT_INCLUDE_TESTS       = true
LLVM_ENABLE_RUNTIMES         = "flang-rt"
LLVM_INCLUDE_TESTS           = true
LLVM_LINK_LLVM_DYLIB         = true
