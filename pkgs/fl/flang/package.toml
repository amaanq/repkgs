from = "llvm"

[package]
patches           = [  ]
uses              = [ "cmake" ]
buildDependencies = [ "cpython", "llvm" ]
dependencies      = [ "llvm", "zlib", "zstd", "clang", "mlir" ]
bin               = [ "flang" ]

[package.platforms]
cross = false

[package.cmake]
root = "flang"

[package.cmake.defs]
BUILD_SHARED_LIBS       = false
CLANG_DIR               = "{pkg:clang}/lib/cmake/clang"
FLANG_INCLUDE_DOCS      = false
FLANG_INCLUDE_TESTS     = false
LLVM_DIR                = "{pkg:llvm}/lib/cmake/llvm"
LLVM_INCLUDE_TESTS      = false
LLVM_LINK_LLVM_DYLIB    = true
LLVM_PARALLEL_LINK_JOBS = 4
LLVM_TABLEGEN_EXE       = "{pkg:llvm}/bin/llvm-tblgen"
LLVM_TOOLS_BINARY_DIR   = "{pkg:llvm}/bin"
MLIR_DIR                = "{pkg:mlir}/lib/cmake/mlir"
MLIR_TABLEGEN_EXE       = "{pkg:mlir}/bin/mlir-tblgen"

[package.phases]
remove = [ "cmake.test" ]

[package.phases.after]

[package.tests]
run     = false
version = true
