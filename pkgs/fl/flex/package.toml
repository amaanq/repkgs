[upstream]
purl = "pkg:github/westes/flex"

[[source]]
key  = "default"
url  = "https://github.com/westes/flex/releases/download/{tag}/flex-{version}.tar.gz"
hash = "sha256-HBPAUDpqF4HYocMD3YDIk6OaIUrZw8Gk3K59OmHB6xU="

[pin]
version = "2.6.4"
tag     = "v2.6.4"

[package]
uses              = [ "autotools" ]
buildDependencies = [  ]
dependencies      = [ "m4" ]
bootstrapTools    = true

[package.platforms]
posix = true

[package.autotools]
flags = [ "ac_cv_path_M4={pkg:m4}/bin/m4", "--disable-bootstrap" ]

[package.tests]
run = false

[when.native]
buildDependencies = [ "{pkg:m4}" ]

[when.cross]
buildDependencies = [ "m4" ]
