tag   = "v{version}"
track = "github:google/brotli"
fetch = { url = "https://github.com/google/brotli/archive/refs/tags/v{version}.tar.gz" }
with  = [ "cmake" ]

# curl links brotli, and the full cmake links curl
patches = [ "github:google/brotli/commit/e230f474b87134e8c6c85b630084c612057f253e" ]
[cmake]
tool = "cmake-bootstrap"

[bindings]
cargo   = [ "brotli-sys" ]
python  = [ "brotli" ]
hackage = [ "brotli" ]
