[package]
name                   = "bigtop"
description            = "Build script executor for motley"
license                = "EUPL-1.2"
repository             = "https://github.com/manic-systems/motley"
keywords               = [ "build", "nix", "bootstrap" ]
categories             = [ "command-line-utilities", "development-tools" ]
version.workspace      = true
edition.workspace      = true
readme.workspace       = true
rust-version.workspace = true

[dependencies]
blake3      = { workspace = true }
memchr      = "2.8.3"
misstep     = { workspace = true }
glob        = "0.3"
libc        = "0.2.189"
mummer      = { workspace = true }
pound       = "0.4.2"
ringmasterd = { workspace = true }
roxmltree   = "0.20"
rustix      = { features = [ "event", "net", "thread", "time" ], workspace = true }
serde       = { features = [ "derive" ], version = "1" }
serde_json  = "1"
tightrope   = { workspace = true }

[build-dependencies]
blake3 = { workspace = true }

[lints]
workspace = true
