[package]
name                   = "mummer"
description            = "Compiler wrapper and cache client for motley"
license                = "EUPL-1.2"
repository             = "https://github.com/manic-systems/motley"
keywords               = [ "cache", "compiler", "nix", "bootstrap" ]
categories             = [ "command-line-utilities", "development-tools" ]
version.workspace      = true
edition.workspace      = true
readme.workspace       = true
rust-version.workspace = true

[dependencies]
base64     = "0.23"
blake3     = { workspace = true }
memchr     = "2.8.3"
misstep    = { workspace = true }
pound      = "0.4.2"
serde      = { features = [ "derive" ], version = "1" }
serde_json = { features = [ "preserve_order" ], version = "1" }
sha2       = "0.11"
tempfile   = "3"
toml       = "1"
ureq       = { default-features = false, features = [ "rustls" ], version = "3" }
tightrope  = { workspace = true }
zstd       = { workspace = true }

[lints]
workspace = true
