# nu-lint settings. nuff's `nu --ide-check` stays the parser and type checker of record, and
# nu-lint adds strict typing of every custom command plus idiom checks. Each rule turned off says why.
[groups]
type-safety = "error"
upstream    = "error"
formatting  = "warning"

[rules]
# long lines here are command lines and a quoted "-O2" in a flag list is for the reader, so of the
# formatting rules only spacing stays. A `{|x| … }` is a closure rather than a block, and records
# stay tight the way nu prints them
block_brace_spacing      = "off"
record_brace_spacing     = "off"
wrap_wide_records        = "off"
reflow_wide_lists        = "off"
reflow_wide_pipelines    = "off"
max_function_body_length = "off"
string_may_be_bare       = "off"
explicit_long_flags      = "off"
# `x` and `compile` take argument lists on purpose, and `^tool` marks an external even where nu
# has no builtin of that name
positional_to_pipeline  = "off"
remove_hat_not_builtin  = "off"
spread_list_to_external = "off"
# once closures nest, a named parameter reads better than $in
where_closure_drop_parameter = "off"
screaming_snake_constants    = "warning"
contains_to_regex_op         = "warning"
split_first_to_parse         = "warning"
unused_variable              = "error"
# since nu 0.111 a failing external raises and pipefail is the default
unhandled_external_error = "off"
non_final_failure_check  = "off"
# a missing index or key should fail the build there, where `-o` or `?` would pass a null along
unchecked_get_index          = "off"
unchecked_cell_path_index    = "off"
unsafe_dynamic_record_access = "off"
# `try { ^tool } catch { … }` is how a phase probes an external without failing
catch_builtin_error_try = "off"
# progress and echoed commands belong on stderr because stdout carries data
error_make_for_non_fatal = "off"
# these errors come from failed tools and compiles, with no span in user source to label
add_label_to_error = "off"
# list parameters are built in code (objects, flags), and variadics would only add spreads
list_param_to_variadic = "off"
max_positional_params  = "off"
# phases and tools run by computed store path by design
external_script_as_argument = "off"
dynamic_script_import       = "off"
